<title>Trainer Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one column, phone-first gym notebook. Sticky header, cards per exercise, thumb-reach actions at the bottom. */
:root {
  --bg: #f3f4f2; --surface: #ffffff; --sunk: #e8eae6; --line: #d5d8d2;
  --ink: #181c1f; --ink-2: #4c5459; --ink-3: #7a8287;
  --accent: #1f4fd1; --accent-ink: #ffffff; --accent-soft: #dfe7fb;
  --easy: #1d7a4a; --easy-soft: #dcefe3; --hard: #a35a00; --hard-soft: #f6e6cf;
  --pain: #b3261e; --pain-soft: #f7dcda; --skip: #6b7277;
  --paper: #ffffff; /* ground for black line-art drawings, the same in both themes */
  --overlay: rgba(8, 10, 12, .92); --overlay-ink: #eef0ee; --overlay-btn: rgba(255, 255, 255, .16); /* the photo viewer is dark in both themes */
  /* exercise figures: the body in ink, the far limbs and the machine in greys, the working muscle and the arrow in the accent */
  --fig-bg: #e9ece8; --fig-ink: #1f2529; --fig-far: #9aa1a5; --fig-hl: #1f4fd1; --fig-hlf: #8fa6ec; --fig-eq: #9ea5a9;
  --fig-pad: #c7ccc8; --fig-wt: #687075; --fig-arr: #1f4fd1; --fig-gnd: #b4bab6;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px; --tap: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111416; --surface: #1a1e21; --sunk: #23282c; --line: #30363a;
  --ink: #eef0ee; --ink-2: #b4bcc0; --ink-3: #848c91;
  --accent: #7ea2ff; --accent-ink: #0b1430; --accent-soft: #1d2a4d;
  --easy: #5fd093; --easy-soft: #16321f; --hard: #f0ac4e; --hard-soft: #3a2a12;
  --pain: #ff8a80; --pain-soft: #3d1a18; --skip: #9aa2a7;
  --fig-bg: #252a2e; --fig-ink: #e8ebe9; --fig-far: #7d868c; --fig-hl: #7ea2ff; --fig-hlf: #4a64a8; --fig-eq: #687177;
  --fig-pad: #40474c; --fig-wt: #959ea3; --fig-arr: #7ea2ff; --fig-gnd: #50585d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111416; --surface: #1a1e21; --sunk: #23282c; --line: #30363a;
  --ink: #eef0ee; --ink-2: #b4bcc0; --ink-3: #848c91;
  --accent: #7ea2ff; --accent-ink: #0b1430; --accent-soft: #1d2a4d;
  --easy: #5fd093; --easy-soft: #16321f; --hard: #f0ac4e; --hard-soft: #3a2a12;
  --pain: #ff8a80; --pain-soft: #3d1a18; --skip: #9aa2a7;
  --fig-bg: #252a2e; --fig-ink: #e8ebe9; --fig-far: #7d868c; --fig-hl: #7ea2ff; --fig-hlf: #4a64a8; --fig-eq: #687177;
  --fig-pad: #40474c; --fig-wt: #959ea3; --fig-arr: #7ea2ff; --fig-gnd: #50585d; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)) }
header.top .row { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px }
.brand { font: 700 20px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; flex: 1; min-width: 0 }
.brand small { display: block; font: 500 12px/1.3 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--ink-3); margin-top: 2px }
.iconbtn { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
h1 { font-size: 30px; font-weight: 700; line-height: 1.05 }
h2 { font-size: 22px; font-weight: 700; letter-spacing: .01em }
.eyebrow { font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3) }
.muted { color: var(--ink-2) } .faint { color: var(--ink-3) } .small { font-size: 13px }
.ru { font-size: 12.5px; color: var(--ink-3); line-height: 1.3 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.section-h { display: flex; align-items: baseline; gap: 10px; margin-top: 6px }
.section-h .roman { font: 700 26px/1 var(--f-display); color: var(--accent); min-width: 26px }
.section-h h2 { flex: 1 }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.chip.pain[aria-pressed="true"] { background: var(--pain); border-color: var(--pain); color: #fff }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: 12px; padding: 4px; gap: 4px }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600 }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); color: var(--accent) }
.seg button .ru { display: block; font-weight: 400 }
.btn { min-height: var(--tap); border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--pain); border-color: var(--pain) }
.btn.block { width: 100% }
.btn:disabled { opacity: .5; cursor: default }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.row > .grow { flex: 1; min-width: 0 }
.note { border-radius: 10px; padding: 10px 12px; font-size: 14px; background: var(--sunk) }
.note.warn { background: var(--hard-soft); color: var(--ink) }
.note.stop { background: var(--pain-soft); color: var(--ink); border: 1px solid var(--pain) }
.note.info { background: var(--accent-soft) }
.note strong { font-weight: 600 }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font: 600 12px/1 var(--f-body); letter-spacing: .02em; background: var(--sunk); color: var(--ink-2); white-space: nowrap }
.badge.easy { background: var(--easy-soft); color: var(--easy) } .badge.ok { background: var(--accent-soft); color: var(--accent) }
.badge.hard { background: var(--hard-soft); color: var(--hard) } .badge.fail, .badge.pain { background: var(--pain-soft); color: var(--pain) }
.badge.skipped { color: var(--skip) }
/* exercise cards */
.ex { gap: 8px }
.ex.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.ex.done { background: transparent }
.ex-head { display: flex; gap: 10px; align-items: flex-start }
.ex-head .name { flex: 1; min-width: 0 }
.ex-head .name b { font: 600 19px/1.15 var(--f-display); letter-spacing: .01em; display: block }
.ex-meta { font-size: 13px; color: var(--ink-2) }
.ex-meta .alt { color: var(--ink-3) }
.kebab { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; flex: none }
.how { min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; flex: none; display: inline-flex; align-items: center; gap: 6px }
.how svg { width: 16px; height: 16px }
.how.pic { padding: 3px 10px 3px 3px }
.how.pic img { width: 34px; height: 34px; object-fit: contain; background: var(--paper); border-radius: 7px }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.pics.one { grid-template-columns: 1fr }
.pics figure { margin: 0; display: grid; gap: 4px; min-width: 0 }
.pics img { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: contain; background: var(--paper); border: 1px solid var(--line); border-radius: 10px }
.pics.one img { aspect-ratio: auto }
.pics figcaption { font-size: 12.5px; color: var(--ink-3); text-align: center }
.credit a { color: inherit }
.sets { display: grid; gap: 6px }
.set { display: grid; grid-template-columns: 26px minmax(0,1.25fr) minmax(0,1fr) 48px; gap: 6px; align-items: center }
.set .n { font: 600 15px/1 var(--f-display); color: var(--ink-3); text-align: center }
.stepper { display: grid; grid-template-columns: 34px minmax(0,1fr) 34px; align-items: center; background: var(--sunk); border-radius: 10px; height: 48px }
.stepper button { height: 48px; border: 0; background: transparent; font-size: 20px; font-weight: 600; color: var(--ink-2) }
.stepper .v { text-align: center; font: 600 21px/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap }
.stepper .v small { display: block; font: 400 11px/1.2 var(--f-body); color: var(--ink-3); margin-top: 2px }
.tick { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 20px; color: var(--ink-3) }
.tick[aria-pressed="true"] { background: var(--easy); border-color: var(--easy); color: #fff }
.set.done .stepper { background: var(--easy-soft) }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.rate button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px }
.rate button[data-r="easy"][aria-pressed="true"] { background: var(--easy); border-color: var(--easy); color: #fff }
.rate button[data-r="ok"][aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.rate button[data-r="hard"][aria-pressed="true"] { background: var(--hard); border-color: var(--hard); color: #fff }
.rate button[data-r="fail"][aria-pressed="true"], .rate button[data-r="pain"][aria-pressed="true"] { background: var(--pain); border-color: var(--pain); color: #fff }
.rate button[data-r="skipped"][aria-pressed="true"] { background: var(--skip); border-color: var(--skip); color: #fff }
.ss-link { font: 600 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding-left: 14px }
.wu { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line) }
.wu:first-of-type { border-top: 0 }
.wu b { font-weight: 600 }
.dots { display: flex; gap: 6px }
.dots .tick { width: 44px; height: 44px; font-size: 15px; font-weight: 600 }
.cf-items { display: grid; gap: 6px }
.cf-item { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line) }
.cf-item:first-child { border-top: 0 }
.cf-item .dose { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right }
.cf-item .dose small { display: block; font: 400 11px/1.2 var(--f-body); color: var(--ink-3) }
.clock { font: 700 46px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: center; letter-spacing: .02em }
.warn-t { color: var(--hard) }
.sheet-st { display: flex; gap: 10px; align-items: flex-start }
.sheet-st .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ink-3) }
.sheet-st.ok .dot { background: var(--easy) } .sheet-st.bad .dot { background: var(--pain) } .sheet-st.busy .dot { background: var(--accent) }
.kit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px }
.kit-q { display: inline-flex; gap: 6px }
.kit-q .how { min-height: 34px }
.hold { min-width: 64px; justify-content: center; font-variant-numeric: tabular-nums }
.hold[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
/* bottom bar + sheets */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px }
.bar .in .btn { flex: 1 }
.rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 7; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25) }
.rest b { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 52px }
.rest button { min-height: 36px; border-radius: 999px; border: 0; padding: 0 12px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,14,.45); display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center }
.list { display: flex; flex-direction: column; gap: 8px }
.opt { text-align: left; min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px }
.opt b { font-weight: 600 }
.media { display: grid; gap: 10px }
.media img, .media video { width: 100%; max-width: 100%; border-radius: 10px; background: var(--sunk) }
.linkcard { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 56px }
.linkcard .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none }
.linkcard .ic svg { width: 18px; height: 18px }
.linkcard span { min-width: 0 }
.tips { white-space: pre-wrap; font-size: 14.5px }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px }
.kv dt { color: var(--ink-3) } .kv dd { margin: 0 }
textarea, input[type=text], input[type=number] { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 46px }
textarea { min-height: 80px; resize: vertical }
.hist { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: center }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; display: inline-block }
@keyframes sp { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none } }
.empty { text-align: center; padding: 28px 12px }
.empty h1 { margin-bottom: 8px }
/* session clock: the header shows the whole workout and the part in progress; cards and section heads show their own time */
.brand.live { cursor: pointer; text-transform: none; letter-spacing: 0 }
.hdr-row { display: flex; align-items: baseline; gap: 8px }
.hdr-lbl { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3) }
.hdr-total { font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--ink) }
.brand.live small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2) }
.brand.live small [data-t] { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600 }
.tmr { font: 600 13px/1 var(--f-body); font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap }
.tmr.live { color: var(--accent) }
.ex-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.section-h .tmr { align-self: center }
/* last result and record: one quiet line on each exercise */
.rec { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; line-height: 1.35; color: var(--ink-3); margin-top: 3px }
.rec span { min-width: 0 }
.ex-head .name .rec b, .rec b { display: inline; font: 600 12.5px/1.35 var(--f-body); letter-spacing: 0; color: var(--ink-2) }
/* swaps */
.swapline { display: flex; gap: 8px; align-items: center }
.swapline .grow { flex: 1; min-width: 0 }
.swapline .how { min-height: 34px }
.ring .opt { flex-direction: row; align-items: center; gap: 12px }
.ring .opt[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft) }
.ring .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.ring .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.thumb { width: 46px; height: 46px; border-radius: 8px; object-fit: contain; background: var(--paper); border: 1px solid var(--line); flex: none }
.thumb.none { display: grid; place-items: center; background: var(--sunk); color: var(--ink-3) }
.thumb.none svg { width: 22px; height: 22px }
.tag { font: 600 11px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent) }
.warn-s { color: var(--hard) }
/* crossfit time typed in */
.dur { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto; gap: 8px; align-items: center }
.dur input { text-align: center; font: 600 24px/1 var(--f-display); font-variant-numeric: tabular-nums; min-height: 52px }
.dur .u { font-size: 14px; color: var(--ink-2) }
.linkbtn { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; font-size: 14px; text-align: left; align-self: flex-start; min-height: 36px }
.clock.over { color: var(--hard) }
/* bottom sheets: a header with the title and a close button stays on top while the body scrolls; drag the header down to close */
html.sheet-open, html.sheet-open body { overflow: hidden }
.sheet { padding-top: 0; overscroll-behavior: contain }
.sheet > * { flex-shrink: 0 }   /* a scrolling flex column would squeeze clipped blocks (.acts) to a sliver */

@media (prefers-reduced-motion: reduce) { .sheet.enter { animation: none } }
.sheet-h { position: sticky; top: 0; z-index: 2; background: var(--bg); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: start; padding: 8px 0 8px; touch-action: none }
.sheet-h .grab { grid-column: 1 / -1; justify-self: center; margin-bottom: 4px }
.sheet-h h2 { overflow-wrap: anywhere }
.sheet-h .x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--sunk); color: var(--ink-2); font-size: 22px; line-height: 1; display: grid; place-items: center }
.acts { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden }
.acts > a, .acts > button { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 14px; min-height: 56px; text-align: left; width: 100% }
.acts > :first-child { border-top: 0 }
.acts .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none }
.acts .ic svg { width: 18px; height: 18px }
.acts span { min-width: 0 }
.acts button:disabled { opacity: .6; cursor: default }
.tipbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; font-size: 14.5px }
/* pictures: tap to enlarge; empty slots invite a photo of this gym's machine and its instructions plate */
.picbtn { display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 10px }
.add-tile { width: 100%; aspect-ratio: 4 / 5; max-width: 100%; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; color: var(--ink-2); font-size: 13px; font-weight: 600; text-align: center }

    return el("div", { class: "hist" }, el("div", { style: "min-width:0" }, el("b", { text: enName(it.id) }), el("div", { class: "small muted", text: (a ? a.lb.map((v, i) => `${v}×${a.reps_per_set[i]}`).join(" · ") : "no sets logged") + (t[k] >= 30 ? ` · ${mins(t[k])}` : "") }),
        n?.lb?.length ? el("div", { class: "small", text: `Next time: ${n.lb.join(" / ")} lb` }) : r && !w.sync?.feedback_recorded_at ? el("div", { class: "small faint", text: NEXT_HINT[r] || "" }) : null),
      el("span", { class: "badge " + (r || ""), text: RATINGS.find(x => x[0] === r)?.[1] || "not rated" })); });
  const synced = w.sync?.feedback_recorded_at;
  const parts = [["warmup", "Warm-up"], ["strength", "Strength"], ["crossfit", "Crossfit"]].filter(([k]) => t[k] >= 30).map(([k, l]) => `${l} ${mins(t[k])}`);
  return [el("div", { class: "card" }, el("div", { class: "eyebrow", text: fmtDate(w.date) }), el("h1", { text: `${DAY_EN[w.day]} done` }),

      el("p", { class: "muted", text: synced ? `The trainer has it too (${fmtDate(synced)}).${Object.keys(nt).length ? " Next session's weights are below." : ""}`
        : "Saved. The trainer's engine picks up your ratings at its next sync (“синхронизируй приложение” in Claude Code); until then the next plan starts from what you actually lifted." }),
      sheetStatusNode(w),
      w.gym_reports?.length ? el("p", { class: "small faint", text: "Gym notes for the trainer: " + w.gym_reports.map(r => r.have ? `has ${enName(r.have)}` : r.missing ? `no ${enName(r.missing)}` : `${r.status === "have" ? "has" : "no"} ${KIT_EN[r.equip] || r.equip}`).join(", ") }) : null),
    el("div", { class: "card" }, el("div", { class: "eyebrow", text: "Strength" }), ...rows,
      fb.crossfit_time ? el("div", { class: "hist" }, el("b", { text: "Crossfit" }), el("span", { class: "badge " + (fb.crossfit_rating || ""), text: fb.crossfit_time })) : null),
    el("button", { class: "btn primary block", type: "button", on: { click: () => { S.view = "home"; S.cur = null; S.ck = null; render(); } } }, "Done")];
}
function historyView() {
  const ws = Object.values(S.workouts).filter(w => w.status !== "planned" || w.source === "skill").sort((a, b) => a.id < b.id ? 1 : -1);

        el("span", { class: "badge" + (inSheet ? " easy" : w.status === "done" ? " hard" : ""), text: st }),
