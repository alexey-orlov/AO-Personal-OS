<title>Trainer Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one column, phone-first gym notebook. Sticky header, cards per exercise, thumb-reach actions at the bottom. */
:root {
  --bg: #f3f4f2; --surface: #ffffff; --sunk: #e8eae6; --line: #d5d8d2;

  --easy: #1d7a4a; --easy-soft: #dcefe3; --hard: #a35a00; --hard-soft: #f6e6cf;
  --pain: #b3261e; --pain-soft: #f7dcda; --skip: #6b7277;
  --paper: #ffffff; /* ground for black line-art drawings, the same in both themes */
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px; --tap: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111416; --surface: #1a1e21; --sunk: #23282c; --line: #30363a;
  --ink: #eef0ee; --ink-2: #b4bcc0; --ink-3: #848c91;
  --accent: #7ea2ff; --accent-ink: #0b1430; --accent-soft: #1d2a4d;
  --easy: #5fd093; --easy-soft: #16321f; --hard: #f0ac4e; --hard-soft: #3a2a12;
  --pain: #ff8a80; --pain-soft: #3d1a18; --skip: #9aa2a7; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111416; --surface: #1a1e21; --sunk: #23282c; --line: #30363a;
  --ink: #eef0ee; --ink-2: #b4bcc0; --ink-3: #848c91;
  --accent: #7ea2ff; --accent-ink: #0b1430; --accent-soft: #1d2a4d;
  --easy: #5fd093; --easy-soft: #16321f; --hard: #f0ac4e; --hard-soft: #3a2a12;
  --pain: #ff8a80; --pain-soft: #3d1a18; --skip: #9aa2a7; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }

  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));

.how.pic { padding: 3px 10px 3px 3px }
.how.pic img { width: 34px; height: 34px; object-fit: contain; background: var(--paper); border-radius: 7px }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.pics.one { grid-template-columns: 1fr }

.pics.one img { aspect-ratio: auto }
.pics figcaption { font-size: 12.5px; color: var(--ink-3); text-align: center }
.credit a { color: inherit }
.sets { display: grid; gap: 6px }
.set { display: grid; grid-template-columns: 26px minmax(0,1.25fr) minmax(0,1fr) 48px; gap: 6px; align-items: center }
.set .n { font: 600 15px/1 var(--f-display); color: var(--ink-3); text-align: center }
.stepper { display: grid; grid-template-columns: 34px minmax(0,1fr) 34px; align-items: center; background: var(--sunk); border-radius: 10px; height: 48px }
.stepper button { height: 48px; border: 0; background: transparent; font-size: 20px; font-weight: 600; color: var(--ink-2) }

.stepper .v small { display: block; font: 400 11px/1.2 var(--f-body); color: var(--ink-3); margin-top: 2px }
.tick { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-size: 20px; color: var(--ink-3) }
.tick[aria-pressed="true"] { background: var(--easy); border-color: var(--easy); color: #fff }
.set.done .stepper { background: var(--easy-soft) }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.rate button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px }
.rate button[data-r="easy"][aria-pressed="true"] { background: var(--easy); border-color: var(--easy); color: #fff }
.rate button[data-r="ok"][aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.rate button[data-r="hard"][aria-pressed="true"] { background: var(--hard); border-color: var(--hard); color: #fff }
.rate button[data-r="fail"][aria-pressed="true"], .rate button[data-r="pain"][aria-pressed="true"] { background: var(--pain); border-color: var(--pain); color: #fff }
.rate button[data-r="skipped"][aria-pressed="true"] { background: var(--skip); border-color: var(--skip); color: #fff }
.ss-link { font: 600 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding-left: 14px }
.wu { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line) }
.wu:first-of-type { border-top: 0 }
.wu b { font-weight: 600 }
.dots { display: flex; gap: 6px }
.dots .tick { width: 44px; height: 44px; font-size: 15px; font-weight: 600 }
.cf-items { display: grid; gap: 6px }
.cf-item { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line) }
.cf-item:first-child { border-top: 0 }
.cf-item .dose { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right }
.cf-item .dose small { display: block; font: 400 11px/1.2 var(--f-body); color: var(--ink-3) }
.clock { font: 700 46px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: center; letter-spacing: .02em }
.kit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px }
.kit-q { display: inline-flex; gap: 6px }
.kit-q .how { min-height: 34px }
.hold { min-width: 64px; justify-content: center; font-variant-numeric: tabular-nums }
.hold[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);

.bar .in .btn { flex: 1 }

.rest b { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 52px }

.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center }
.list { display: flex; flex-direction: column; gap: 8px }
.opt { text-align: left; min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px }
.opt b { font-weight: 600 }
.media { display: grid; gap: 10px }
.media img, .media video { width: 100%; max-width: 100%; border-radius: 10px; background: var(--sunk) }
.linkcard { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 56px }
.linkcard .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none }
.linkcard .ic svg { width: 18px; height: 18px }
.linkcard span { min-width: 0 }
.tips { white-space: pre-wrap; font-size: 14.5px }

.kv dt { color: var(--ink-3) } .kv dd { margin: 0 }
textarea, input[type=text], input[type=number] { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 46px }

.hist { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: center }

</style>

<header class="top"><div class="row">
  <div class="brand" id="brand">Trainer Notebook<small id="brandSub">Loading…</small></div>

</div></header>

<script>
"use strict";
/* ================================================================ state */
const S = {
  db: null, sample: null, assets: null, ready: false, offline: false,
  cfg: {}, briefs: {}, workouts: {}, media: {}, requests: {},
  view: "home", cur: null, ck: null, building: null, buildCtl: null,
  rest: null, cfTimer: null, sheet: null, err: null,
};
const KG_LB = 2.2046226218;
const DAYS = ["legs", "push", "pull"];
const DAY_EN = { legs: "Legs", push: "Chest", pull: "Back" };
const ROLE_RANK = { main: 0, secondary: 1, isolation: 2, shoulder: 3 };
const RATINGS = [["easy", "Easy"], ["ok", "OK"], ["hard", "Hard"], ["fail", "Failed reps"], ["pain", "Pain"], ["skipped", "Skipped"]];
const PAIN_SPOTS = [
  { key: "lower_back", joint: "lower_back", label: "Lower back" },
  { key: "neck", joint: "neck", label: "Neck" },
  { key: "knee_left", joint: "knee", side: "left", label: "Left knee" },
  { key: "knee_right", joint: "knee", side: "right", label: "Right knee" },
  { key: "shoulder", joint: "shoulder", label: "Shoulder" },
  { key: "elbow", joint: "elbow", label: "Elbow" },
  { key: "wrist", joint: "wrist", label: "Wrist" },
  { key: "hip", joint: "hip", label: "Hip" },
  { key: "calf", joint: "calf", label: "Calf" },
  { key: "other", joint: null, label: "Other" },
];
const JOINT_EN = { lower_back: "lower back", neck: "neck", knee: "knee", shoulder: "shoulder", elbow: "elbow", wrist: "wrist", hip: "hip", calf: "calf" };
/* rest between sets by the exercise's role (compound lifts longer, isolation shorter) */
const REST_SEC = { main: 120, secondary: 90, isolation: 75, shoulder: 60 };
/* what each rating does to the next plan (engine rules, trainer.py suggest) */
const NEXT_HINT = {
  easy: "Next time the weight goes up a session sooner.",
  ok: "Normal slow progression.",
  hard: "Weight held next time. Hard twice in a row: one step back.",
  fail: "One step back next time.",
  pain: "Swapped next time; nothing loading that joint goes up.",
  skipped: "No change next time.",
};

/* ================================================================ helpers */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {

    else if (k === "text") n.textContent = v;
    else if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);

const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',

const icon = k => el("span", { class: "ic", html: ICON[k] });
const lbToKg = lb => Math.round(lb / KG_LB * 10) / 10;
const kgToLb5 = kg => 5 * Math.round(kg * KG_LB / 5);
const nowISO = () => new Date().toISOString();
function todayLocal() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function fmtDate(iso) { if (!iso) return "—"; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
function daysBetween(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5); }
function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }
function parseMMSS(s) { const m = /^\s*(\d{1,2})[:.](\d{2})\s*$/.exec(s || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function safeUrl(u) { return typeof u === "string" && /^https:\/\//i.test(u) ? u : null; }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

/* ================================================================ catalog access */
const cat = () => S.cfg.catalog || null;
let IDX = null;
function idx() {
  const c = cat(); if (!c) return null;
  if (IDX && IDX.src === c) return IDX;
  IDX = { src: c, s: {}, w: {}, c: {} };
  for (const e of c.strength || []) IDX.s[e.id] = e;
  for (const e of c.warmup?.items || []) IDX.w[e.id] = e;
  for (const e of c.crossfit?.items || []) IDX.c[e.id] = e;
  return IDX;
}
const exS = id => idx()?.s[id];
const exW = id => idx()?.w[id];
const exC = id => idx()?.c[id];
function gymCfg() { const g = S.cfg.gym; return g?.gyms?.[g.current] || { units: "lb", steps_lb: {} }; }
const isLb = () => gymCfg().units === "lb";
function stepLb(ex) { return gymCfg().steps_lb?.[ex?.step_class || "stack"] || 10; }
function enName(id) { const e = exS(id) || exW(id) || exC(id); return e ? (e.en_short || e.en) : id; }
function ruName(id) { const e = exS(id) || exW(id) || exC(id); return e ? e.ru : ""; }

/* ================================================================ data loading */
async function boot() {
  render();
  if (!window.claude?.use) { S.offline = true; S.err = "This page needs to be opened in Claude to load your plan."; return render(); }

    const st = w.status === "done" ? (synced ? "synced" : "waiting for sync") : w.status;
    return el("button", { class: "opt", type: "button", on: { click: () => { S.cur = w.id; S.view = w.status === "done" ? "summary" : "workout"; render(); } } },
      el("div", { class: "row" }, el("b", { class: "grow", text: `${fmtDate(w.date)} · ${DAY_EN[w.day] || w.day}` }), el("span", { class: "badge" + (synced ? " easy" : w.status === "done" ? " hard" : ""), text: st })),
      el("span", { class: "small muted", text: (w.plan?.strength || []).map(it => enName(it.id)).join(", ") }),
      w.sync?.note ? el("span", { class: "small faint", text: "Trainer: " + w.sync.note } ) : null);
  }));
}

boot();
</script>
