<style>
/* Layout: one screen. A header strip, a listings rail on the left, the map filling the rest;

  --call: #f8c4dc;

  --call-soft: rgba(232, 104, 162, 0.16);
  --gone: #d4d8d4;

  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Barlow Semi Condensed", "Public Sans", system-ui, -apple-system, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));

}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font-ui); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 5;
}
.brand { min-width: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 22px/1.1 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.brand .meta { margin: 0; color: var(--muted); font-size: 13px; }
.sync { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sync__status { color: var(--ink-2); font-size: 13px; min-width: 0; }
.sync__status.is-warn { color: var(--warn-ink); }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 7px 12px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px;
}
.btn:hover { background: var(--surface-2); }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn--primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn[disabled] { opacity: 0.6; cursor: progress; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.is-busy svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn.is-busy svg { animation: none; } }

.body { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.rail { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); }
.rail__head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px 10px var(--gutter-l); border-bottom: 1px solid var(--line);
}
.rail__count { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.sort { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.sort select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 6px; font-size: 13px; color: var(--ink); }
.list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; min-height: 0; }
.item {
  display: grid; grid-template-columns: 68px 1fr auto; gap: 2px 10px; width: 100%; text-align: left;
  padding: 9px 14px 9px var(--gutter-l); border: 0; background: none; cursor: pointer; border-bottom: 1px solid var(--line);
}
.item:hover { background: var(--surface-2); }
.item.is-selected { background: var(--accent-soft); }
.item__price { grid-row: span 2; font: 700 17px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.item__price.is-none { color: var(--muted); font-weight: 600; font-size: 14px; }
.item__title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item__facts { grid-column: 2; color: var(--muted); font-size: 12.5px; min-width: 0; }
.item__where { grid-column: 2 / span 2; color: var(--ink-2); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item__status { grid-row: 1; grid-column: 3; align-self: start; min-width: 0; }
.item__status .chip { max-width: 128px; } /* a long sheet status must not squeeze the title */
.chip__t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.item.is-dim .item__price, .item.is-dim .item__title { opacity: 0.6; }
.item.mark-gone .item__price, .item.mark-gone .item__title, .item.mark-gone .item__facts { opacity: 0.5; }
.no { display: inline-flex; vertical-align: -1px; color: var(--muted); }
.no svg { width: 13px; height: 13px; }
.item__where .flag { color: var(--warn-ink); font-weight: 600; }
.item.mark-visited { background: var(--visit-soft); box-shadow: inset 4px 0 0 var(--visit-line); }
.item.mark-planned { background: var(--plan-soft); box-shadow: inset 4px 0 0 var(--plan-line); }
.item.mark-mixed { background: linear-gradient(90deg, var(--visit-soft), var(--plan-soft)); box-shadow: inset 4px 0 0 var(--plan-line); }
.item.mark-call { background: var(--call-soft); box-shadow: inset 4px 0 0 var(--call-line); }
.item.mark-gone { background: var(--gone-soft); box-shadow: inset 4px 0 0 var(--gone-line); }
.item.is-selected { background: var(--accent-soft); }
.star { color: var(--star); }
.list .empty { padding: 18px 16px; color: var(--muted); }
.list .empty button { margin-top: 8px; }
.layers__sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; justify-self: start; }
.seg button { border: 0; background: none; padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg i, .legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw-visited { background: var(--visit); border: 1px solid var(--visit-line); }
.sw-planned { background: var(--plan); border: 1px solid var(--plan-line); }
.sw-none { background: var(--pin); border: 1px solid var(--pin-line); }
.sw-mixed { background: linear-gradient(90deg, var(--visit) 50%, var(--plan) 50%); border: 1px solid var(--plan-line); }
.sw-call { background: var(--call); border: 1px solid var(--call-line); }
.sw-gone { background: var(--gone); border: 1px solid var(--gone-line); }
.rail__foot { padding: 10px 14px 12px var(--gutter-l); border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; }
.rail__foot:empty { display: none; }
.rail__foot p { margin: 0; }
.rail__foot b { color: var(--warn-ink); font-weight: 600; }

/* "Planned visit" checkbox on a listing card: unticked = outline, ticked = the blue of planned pins. */
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pref { display: inline-flex; gap: 6px; }
.pref__btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px 6px 9px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; }
.pref__btn:hover { background: var(--surface-2); }
.pref__btn svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.pref__btn .star { font-size: 14px; line-height: 1; }
.pref__btn--like[aria-pressed="true"] { background: color-mix(in srgb, var(--star) 20%, var(--surface)); border-color: var(--star); }
.pref__btn--dislike[aria-pressed="true"] { background: color-mix(in srgb, var(--muted) 24%, var(--surface)); border-color: var(--muted); }
.pref__btn--dislike[aria-pressed="true"] svg { color: var(--ink); }
.pref__btn:disabled { opacity: 0.6; cursor: not-allowed; }
.plan { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 9px; border-radius: 8px;
  border: 1px solid var(--plan-line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
.plan input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.plan__box { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--plan-line); background: var(--surface); display: grid; place-items: center; flex: none; color: #ffffff; }
.plan__box svg { width: 11px; height: 11px; opacity: 0; }
.plan:hover { background: var(--plan-soft); }
.plan:has(input:checked) { background: var(--plan); color: var(--sticker-ink); }
.plan:has(input:checked) .plan__box { background: var(--plan-line); }
.plan:has(input:checked) .plan__box svg { opacity: 1; }
.plan:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.plan:has(input:disabled) { opacity: 0.6; cursor: not-allowed; }
.plan.is-busy { cursor: progress; }
.plan__note { margin: 0; color: var(--muted); font-size: 12px; }
.plan__note.is-warn { color: var(--warn-ink); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px 1px 5px; white-space: nowrap; }
.chip svg, .pin svg { width: 12px; height: 12px; flex: none; }
.chip--done { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.chip--req { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn-ink) 40%, transparent); }

.mapwrap { position: relative; min-width: 0; min-height: 0; }
.map { position: absolute; inset: 0; background: var(--bg); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 600; pointer-events: none; }
.loading[hidden] { display: none !important; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.layers { position: absolute; top: 12px; left: 12px; z-index: 3; padding: 8px 12px; max-height: calc(100% - 24px); overflow-y: auto; }
.layers__body { display: grid; gap: 6px; }
.layers__toggle { display: none; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 2px 0; font-weight: 700; font-size: 13px; color: var(--ink); }
.layers__toggle::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin: -3px 0 0 4px; }
.layers.is-collapsed .layers__body { display: none; }
.layers.is-collapsed .layers__toggle::after { transform: rotate(-135deg); margin-top: 3px; }
.layers:not(.is-collapsed) .layers__toggle { margin-bottom: 6px; }
@media (max-width: 900px), (max-height: 620px) { .layers__toggle { display: inline-flex; } }
.switch { display: flex; align-items: center; gap: 9px; cursor: pointer; font-weight: 600; font-size: 13px; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch__ui { width: 30px; height: 18px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background 0.15s; }
.switch__ui::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 0.15s; }
.switch input:checked + .switch__ui { background: var(--accent); }
.switch input:checked + .switch__ui::after { transform: translateX(12px); }
.switch input:focus-visible + .switch__ui { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { position: absolute; left: 12px; bottom: 34px; z-index: 3; padding: 0; max-width: min(300px, calc(100% - 24px));
  max-height: calc(100% - 140px); overflow-y: auto; font-size: 12.5px; }
.legend__toggle { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; cursor: pointer; padding: 8px 12px 4px;
  font: 700 12px/1.2 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-align: left; }
.legend__toggle::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin: -3px 0 0 auto; }
.legend.is-collapsed .legend__toggle { padding-bottom: 8px; }
.legend.is-collapsed .legend__toggle::after { transform: rotate(-135deg); margin-top: 3px; }
.legend__body { padding: 4px 12px 10px; }
.legend.is-collapsed .legend__body { display: none; }
.legend h3 { margin: 0 0 6px; font: 700 12px/1.2 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.legend section + section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.legend li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 2px solid; }
.legend .dash { width: 22px; height: 0; border-top: 2px dashed var(--ink-2); flex: none; }
.legend .note { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend .row span { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
.legend .row svg { width: 12px; height: 12px; }

.card { position: absolute; top: 12px; right: 12px; z-index: 4; width: 380px; max-width: calc(100% - 24px);
  max-height: calc(100% - 24px); overflow-y: auto; padding: 0; }
.card[hidden] { display: none !important; }
.card__head { position: sticky; top: 0; background: var(--surface); padding: 14px 44px 10px 16px; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; z-index: 1; }
.card__kicker { margin: 0 0 2px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.card__title { margin: 0; font: 700 21px/1.15 var(--font-display); text-wrap: balance; }
.card__sub { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; }
.card__close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.card__close:hover { background: var(--surface-2); color: var(--ink); }
.card__body { padding: 12px 16px 16px; display: grid; gap: 14px; }
.unit { display: grid; gap: 8px; }
.unit + .unit { padding-top: 14px; border-top: 1px solid var(--line); }
.unit__top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.unit__name { font-weight: 700; font-size: 15px; min-width: 0; }
.unit__price { font: 700 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.unit__price small { font: 500 13px var(--font-ui); color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 13px; }
.facts b { font-weight: 600; color: var(--ink); }
.notes { margin: 0; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
.notes.warn { background: color-mix(in srgb, var(--warn-ink) 12%, var(--surface)); color: var(--ink); border-left: 3px solid var(--warn-ink); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv .old { color: var(--muted); font-size: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 13px; text-decoration: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; color: var(--ink); }
.links a:hover { background: var(--surface-2); }
.section-label { margin: 0 0 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.precision { margin: 0; color: var(--muted); font-size: 12px; }
.mix { display: flex; height: 12px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); }
.mix span { display: block; height: 100%; }
.mixkey { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; margin-top: 7px; font-size: 12.5px; color: var(--ink-2); }
.mixkey span { display: flex; align-items: center; gap: 6px; min-width: 0; }
.mixkey i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.mixkey b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: auto; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 7px 9px; }
.stat b { display: block; font: 700 18px/1.1 var(--font-display); }
.stat span { color: var(--muted); font-size: 11.5px; }
.inzone { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.inzone button { width: 100%; display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 5px 6px; border-radius: 6px; cursor: pointer; text-align: left; }
.inzone button:hover { background: var(--surface-2); }
.inzone .p { font: 700 14px var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Pin = a 0x0 marker box sitting exactly on the address point: dot centred on it, stem up, label on top. */
.pinwrap { --pin-bg: var(--pin); --pin-bd: var(--pin-stem); --pin-fg: var(--pin-ink); width: 0; height: 0; }
.pinwrap.mk-visited { --pin-bg: var(--visit); --pin-bd: var(--visit-line); --pin-fg: var(--sticker-ink); }
.pinwrap.mk-planned { --pin-bg: var(--plan); --pin-bd: var(--plan-line); --pin-fg: var(--sticker-ink); }
.pinwrap.mk-mixed { --pin-bg: var(--plan); --pin-bd: var(--plan-line); --pin-fg: var(--sticker-ink); }
.pinwrap.mk-call { --pin-bg: var(--call); --pin-bd: var(--call-line); --pin-fg: var(--sticker-ink); }
.pinwrap.mk-gone { --pin-bg: var(--gone); --pin-bd: var(--gone-line); --pin-fg: var(--sticker-ink); }
.pinwrap.is-hold { opacity: var(--pin-dim); }
.pinwrap.mk-gone { opacity: 0.6; }
.pin__no { display: inline-flex; color: var(--muted); }
.pinwrap:hover { z-index: 4; opacity: 1; }
.pinwrap.is-selected { z-index: 5; opacity: 1; }
.pin { position: absolute; left: 0; bottom: 10px; transform: translateX(-50%); margin: 0;
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px;
  background: var(--pin-bg); color: var(--pin-fg); border: 1px solid var(--pin-bd); box-shadow: var(--shadow);
  font: 600 13.5px/1.15 var(--font-display); font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap; }
.pinwrap.mk-mixed .pin { background: linear-gradient(90deg, var(--visit) 50%, var(--plan) 50%); }
.pin__stem { position: absolute; left: -1px; bottom: 3px; width: 2px; height: 8px; background: var(--pin-bd); pointer-events: none; }
.pin__dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--pin-bg); border: 2px solid var(--pin-bd); cursor: pointer; }
.pinwrap.is-selected .pin { box-shadow: 0 0 0 2.5px var(--ink), var(--shadow); }

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>Walnut Creek rentals</h1>
      <p class="meta" id="meta">From the “WC appartment” tab of Relocation planning</p>

    <div class="sync">

      <div class="loading" id="mapLoading">Drawing the map…</div>
      <div class="layers panel" role="group" aria-label="Map layers and filters" id="layers">
        <button type="button" class="layers__toggle" id="layersToggle" aria-expanded="true" aria-controls="layersBody">Map options</button>
        <div class="layers__body" id="layersBody">
        <label class="switch" for="tSchools"><input type="checkbox" id="tSchools" autocomplete="off"><span class="switch__ui" aria-hidden="true"></span><span>Intermediate school zones</span></label>
        <label class="switch" for="tHoods"><input type="checkbox" id="tHoods" autocomplete="off"><span class="switch__ui" aria-hidden="true"></span><span>Neighborhood zones</span></label>

          <button type="button" data-beds="any" aria-pressed="true">Any beds</button>
          <button type="button" data-beds="2" aria-pressed="false">2 bd</button>
          <button type="button" data-beds="3" aria-pressed="false">3 bd</button>
        </div>
        </div>
      </div>
      <div class="legend panel" id="legend"></div>
      <section class="card panel" id="card" hidden aria-label="Details"></section>
      <button class="listtoggle" id="listToggle" type="button" aria-controls="rail" aria-expanded="false">List</button>
    </main>
  </div>
</div>

  function showLooseCard(l) {

    var html = '<div class="card__head">' + CLOSE + '<p class="card__kicker">Listing · not on the map</p>' +
      '<h2 class="card__title" tabindex="-1">' + esc(headline(l)) + "</h2>" + '<p class="card__sub">' + esc(l.address || "No address in the sheet") + "</p></div>" +
      '<div class="card__body">' + unitHtml(l) + '<p class="precision">' + (l.address ? "This address couldn't be placed. Add lat and lng columns to the sheet to pin it by hand." : "Add the address to the sheet to put it on the map.") + "</p></div>";
    openCard(html, headline(l));
  }
  function mixBar(mix) {
    var parts = [["Houses", mix.sfd, "var(--mix-1)"], ["Townhomes, 2–4 units", (mix.sfa || 0) + (mix.u2_4 || 0), "var(--mix-2)"], ["Apartments, 5–19", mix.u5_19, "var(--mix-3)"], ["Apartments, 20+", mix.u20p, "var(--mix-4)"]];
    var tot = parts.reduce(function (s, p) { return s + (p[1] || 0); }, 0) || 1;
    return '<div class="mix" role="img" aria-label="' + parts.map(function (p) { return p[0] + " " + Math.round(100 * (p[1] || 0) / tot) + "%"; }).join(", ") + '">' +
      parts.map(function (p) { var w = 100 * (p[1] || 0) / tot; return w > 0.5 ? '<span style="width:' + w.toFixed(1) + "%;background:" + p[2] + '"></span>' : ""; }).join("") + "</div>" +
      '<div class="mixkey">' + parts.map(function (p) { return '<span><i style="background:' + p[2] + '"></i>' + p[0] + "<b>" + Math.round(100 * (p[1] || 0) / tot) + "%</b></span>"; }).join("") + "</div>";
  }
  function inZoneList(test) {
    var items = S.listings.filter(function (l) { return l.group && test(l.group) && isVisible(l); });
    if (!items.length) return '<p class="muted" style="margin:0">' + (filtering() ? "No listings here match the filters." : "No listings from the sheet here.") + "</p>";
    items.sort(function (a, b) { return (a.price == null ? Infinity : a.price) - (b.price == null ? Infinity : b.price); });
    return '<ul class="inzone">' + items.map(function (l) { return '<li><button type="button" data-g="' + l.group.key + '"><span>' + starIcon(l) + noIcon(l) + (l.mark ? '<i class="swatch sw-' + l.mark + '" style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px"></i>' : "") + esc(headline(l)) + '</span><span class="p">' + (l.price != null ? esc(money(l.price)) : "—") + "</span></button></li>"; }).join("") + "</ul>";
  }
  function wireInZone() { $("card").querySelectorAll("[data-g]").forEach(function (b) { b.addEventListener("click", function () { select(b.getAttribute("data-g"), "list"); }); }); }
  function showZoneCard(hoodId, midFeature) {
    var D = S.data, parts = [], title = "", kicker = "", sub = "";
    setZoneSel(hoodId, hoodId == null && midFeature ? midFeature.id : null);
    S.sel = null; S.loose = null; markSelectedPin(); renderList();
    if (hoodId != null) {
      var z = D.hoods.features[hoodId].properties;
      title = z.name; kicker = "Neighborhood zone"; sub = z.sub + (z.juris ? " · " + z.juris : "");
      var c = D.hoodLabels.features.filter(function (f) { return f.properties.id === z.id; })[0];
      var ll = c ? c.geometry.coordinates : null;
      if (z.note) parts.push('<p class="notes warn">' + esc(z.note) + "</p>");
      if (z.openSpace) parts.push('<p class="muted" style="margin:0">Public open space with trails; no homes.</p>');
      else {
        parts.push('<div><p class="section-label">Homes here</p>' + (z.units >= 40 ? mixBar(z.mix) : '<p class="muted" style="margin:0">Too few homes for a housing mix.</p>') + "</div>");
        parts.push('<div class="stats">' +
          '<div class="stat"><b>' + (z.yr ? "~" + z.yr : "—") + "</b><span>median year built</span></div>" +
          '<div class="stat"><b>' + (z.rent != null ? Math.round(z.rent * 100) + "%" : "—") + "</b><span>homes rented</span></div>" +
          '<div class="stat"><b>' + (z.units ? Math.round(z.units / 10) * 10 : "—") + "</b><span>homes, approx.</span></div></div>");
      }
      parts.push('<div><p class="section-label">Listings in this zone</p>' + inZoneList(function (g) { return g.hoodId === hoodId; }) + "</div>");
      if (ll) parts.push('<div class="links">' + link("https://www.google.com/maps/@" + ll[1].toFixed(5) + "," + ll[0].toFixed(5) + ",16z/data=!3m1!1e3", "Satellite view") + link("https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=" + ll[1].toFixed(6) + "," + ll[0].toFixed(6), "Street View") + "</div>");
      parts.push('<p class="precision">Housing mix, year built and renter share: Census ACS 2020–24 block-group estimates, spread over the zone by area. Zone edges follow major roads, creeks, the canal and BART.</p>');
      if (midFeature) parts.push(schoolZonePart(midFeature));
    } else if (midFeature) {
      var m = midFeature.properties;
      title = m.s; kicker = "Intermediate school zone"; sub = m.d + (m.v !== "cur" ? " · " + m.v + " boundary" : "");
      parts.push(schoolZonePart(midFeature, true));
      parts.push('<div><p class="section-label">Listings in this zone</p>' + inZoneList(function (g) { return g.midId === midFeature.id; }) + "</div>");
    }
    openCard('<div class="card__head">' + CLOSE + '<p class="card__kicker">' + esc(kicker) + '</p><h2 class="card__title" tabindex="-1">' + esc(title) + '</h2><p class="card__sub">' + esc(sub) + '</p></div><div class="card__body">' + parts.join("") + "</div>", title);
    wireInZone();
  }
  function schoolZonePart(f, full) {
    var m = f.properties, pt = S.data.schoolPts.features.filter(function (p) { return p.properties.n.indexOf(m.s.replace(" (K-8)", "")) === 0 || m.s.indexOf(p.properties.n) === 0; })[0];
    var rows = [["School", esc(m.s)], ["District", esc(m.d)]];
    if (pt) { rows.push(["Address", esc(pt.properties.a)]); if (pt.properties.gr) rows.push(["Grades", esc(pt.properties.gr)]); }
    rows.push(["Boundary", m.v === "cur" ? "District school locator (current)" : esc(m.v) + " locator copy, may have changed"]);
    return '<div><p class="section-label">' + (full ? "Zone" : "Intermediate school zone") + '</p><dl class="kv">' + rows.map(function (r) { return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl>" +
      (m.s === "Walnut Creek Intermediate" ? '<p class="precision" style="margin-top:6px">Tice Creek School (K-8, Walnut Creek SD) admits by lottery from anywhere in the district.</p>' : "") +
      (m.d === "Mt. Diablo USD" ? '<p class="precision" style="margin-top:6px">Sequoia Middle in Pleasant Hill is open to MDUSD students district-wide.</p>' : "") + "</div>";
  }
  function setZoneSel(hoodId, midId) {
    var map = S.map; if (!map || !map.getLayer("hood-sel")) return;
    if (S.selZone && S.selZone.h != null) map.setFeatureState({ source: "hoods", id: S.selZone.h }, { sel: false });
    S.selZone = (hoodId != null || midId != null) ? { h: hoodId, m: midId } : null;
    if (hoodId != null) map.setFeatureState({ source: "hoods", id: hoodId }, { sel: true });
    map.setFilter("hood-sel", ["==", ["id"], hoodId != null ? hoodId : -1]);
    map.setFilter("mid-sel", ["==", ["id"], midId != null ? midId : -1]);
  }
  function onMapClick(e) {
    if (S.lastPin && Date.now() - S.lastPin < 300) return;
    var layers = []; if (S.showHoods) layers.push("hood-fill"); if (S.showSchools) layers.push("mid-fill");
    var fs = layers.length ? S.map.queryRenderedFeatures(e.point, { layers: layers }) : [];
    var h = fs.filter(function (f) { return f.layer.id === "hood-fill"; })[0], m = fs.filter(function (f) { return f.layer.id === "mid-fill"; })[0];
    if (h || m) { showZoneCard(h ? h.id : null, m ? S.data.mid.features[m.id] : null); return; }
    clearSelection();
  }
  function clearSelection() { setZoneSel(null, null); S.sel = null; S.loose = null; closeCard(); markSelectedPin(); renderList(); }
  function select(key, how) {
    var g = S.byKey[key]; if (!g) return;
    setZoneSel(null, null);
    S.sel = key; S.loose = null; markSelectedPin(); renderList(); showGroupCard(g, true);
    if (how && S.map) revealPin(g.pos, how === "list");
    var el = $("list").querySelector(".item.is-selected"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  }
  // Move the map only when the chosen pin can't be seen: never on close, and never just to re-centre.
  function revealPin(pos, fromList) {
    var map = S.map, c = map.getContainer(), card = $("card"), narrow = window.innerWidth <= 900;
    var w = c.clientWidth, h = c.clientHeight;
    var right = !narrow && !card.hidden ? card.offsetWidth + 24 : 0, bottom = narrow && !card.hidden ? card.offsetHeight : 0;
    var p = map.project(pos), m = 40;
    var inView = p.x > m && p.x < w - right - m && p.y > m + 30 && p.y < h - bottom - m;
    var zoom = fromList ? Math.max(map.getZoom(), 14.6) : map.getZoom();
    if (inView && zoom === map.getZoom()) return;
    map.easeTo({ center: pos, zoom: zoom, offset: [-right / 2, -bottom / 2], duration: 450 });
  }

  /* ---------- legend ---------- */
  function setupLegend() {
    var el = $("legend"), saved = store.get("keyOpen");
    var open = saved == null ? (window.innerWidth >= 1200 && window.innerHeight >= 900) : !!saved;
    el.innerHTML = '<button type="button" class="legend__toggle" id="keyToggle" aria-expanded="' + open + '" aria-controls="legendBody">Key</button><div class="legend__body" id="legendBody"></div>';
    el.classList.toggle("is-collapsed", !open);
    $("keyToggle").addEventListener("click", function () { var now = el.classList.toggle("is-collapsed"); this.setAttribute("aria-expanded", String(!now)); store.set("keyOpen", !now); });
  }
  function renderLegend() {
    var el = $("legendBody"), dark = isDark(), ser = SERIES[dark ? "dark" : "light"], parts = [];
    if (!el) return;
    parts.push('<section><h3>Pins</h3><div class="row">' +
      '<span><i class="swatch sw-visited"></i>Visited</span><span><i class="swatch sw-planned"></i>Planned</span><span><i class="swatch sw-call"></i>To call</span>' +
      '<span><i class="swatch sw-gone"></i>Dismissed</span><span><i class="swatch sw-none"></i>Not yet</span>' +
      '<span><span class="star">★</span> Liked</span><span>Faded: on hold</span><span>— no price</span></div>' +
      '<p class="note">Yellow = visited, blue = planned, pink = a note says to call (to schedule), grey = dismissed (Dislike). Row colours in the sheet count the same way. On a listing’s card, “Planned visit”, Like and Dislike change them here.</p></section>');
    if (S.showSchools && S.data) {
      var view = S.map ? S.map.getBounds() : null;
      var seen = S.data.mid.features.filter(function (f) { if (!view) return true; var b = f._bb; return !(b[2] < view.getWest() || b[0] > view.getEast() || b[3] < view.getSouth() || b[1] > view.getNorth()); });
      seen.sort(function (a, b) { return a.properties.s === "Walnut Creek Intermediate" ? -1 : b.properties.s === "Walnut Creek Intermediate" ? 1 : a.properties.s.localeCompare(b.properties.s); });
      parts.push("<section><h3>Intermediate school zones</h3><ul>" + seen.map(function (f) { var col = ser[f.properties.c]; return '<li><i class="sw" style="background:' + col + "33;border-color:" + col + '"></i><span>' + esc(f.properties.s) + ' <span class="muted">· ' + esc(f.properties.d) + (f.properties.v !== "cur" ? ", " + esc(f.properties.v) : "") + "</span></span></li>"; }).join("") + "</ul>" +
        '<p class="note">Boundaries from the districts’ own school locators (MDUSD edited July 2024; San Ramon Valley from 2016-17). Confirm an address with the district before you sign.</p></section>');
    }
    if (S.showHoods) parts.push('<section><h3>Neighborhood zones</h3><ul><li><i class="dash"></i><span>Areas between major roads, creeks and BART</span></li></ul><p class="note">Click a zone for its housing mix, age and renter share.</p></section>');
    el.innerHTML = parts.join("");
  }

  function renderAll() { renderList(); renderMarkers(); renderLegend(); }

  function toggleList(force) {
    var app = $("app"), on = typeof force === "boolean" ? force : !app.classList.contains("is-list");
    app.classList.toggle("is-list", on); $("listToggle").setAttribute("aria-expanded", on ? "true" : "false"); $("listToggle").textContent = on ? "Map" : "List";
  }

  /* ---------- boot ---------- */
  setupLegend();
  $("tSchools").checked = S.showSchools; $("tHoods").checked = S.showHoods; $("sortSel").value = S.sort;
  $("tSchools").addEventListener("change", function (e) { S.showSchools = e.target.checked; store.set("schools", S.showSchools); setLayerVis(); });
  $("tHoods").addEventListener("change", function (e) { S.showHoods = e.target.checked; store.set("hoods", S.showHoods); setLayerVis(); });
  var VISIT_WORD = { visited: "Visited", planned: "Planned", call: "To call", none: "Not yet" };
  function layersLabel() {
    var on = [];
    if (S.onlyStarred) on.push("★ Liked");
    if (S.hideNo) on.push("no disliked");
    if (S.visit !== "all") on.push(VISIT_WORD[S.visit]);
    if (S.beds.length) on.push(bedsWord(S.beds));
    $("layersToggle").textContent = on.length ? "Filters: " + on.join(" · ") : "Map options";
  }
  var layersCompact = window.matchMedia ? window.matchMedia("(max-width: 900px), (max-height: 620px)") : null;
  function setLayersOpen(open) { $("layers").classList.toggle("is-collapsed", !open); $("layersToggle").setAttribute("aria-expanded", String(!!open)); }
  // Phones and short windows start with the options folded (the button then names any active filters).
  setLayersOpen(!(layersCompact && layersCompact.matches));
  $("layersToggle").addEventListener("click", function () { setLayersOpen($("layers").classList.contains("is-collapsed")); });
  // The filters combine (AND): liked only, hide disliked, visit state, beds. `patch` changes only the ones it names.
  function setFilters(patch) {
    if ("starred" in patch) S.onlyStarred = !!patch.starred;
    if ("hideNo" in patch) S.hideNo = !!patch.hideNo;
    if ("visit" in patch) S.visit = patch.visit;
    if ("beds" in patch) S.beds = patch.beds.slice().sort();
    store.set("starred", S.onlyStarred); store.set("hideNo", S.hideNo); store.set("visit", S.visit); store.set("beds", S.beds);
    $("tStarred").checked = S.onlyStarred; $("tHideNo").checked = S.hideNo; layersLabel();
    $("visitSeg").querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-checked", String(b.getAttribute("data-visit") === S.visit)); });
    $("bedsSeg").querySelectorAll("button").forEach(function (b) { var v = b.getAttribute("data-beds"); b.setAttribute("aria-pressed", String(v === "any" ? !S.beds.length : S.beds.indexOf(+v) >= 0)); });
    if (S.sel && S.byKey[S.sel] && !S.byKey[S.sel].items.some(isVisible)) clearSelection();
    renderMarkers(); renderList();
    if (!$("card").hidden && S.selZone) { var cur = S.selZone; showZoneCard(cur.h, cur.m != null ? S.data.mid.features[cur.m] : null); }
  }
  $("tStarred").addEventListener("change", function (e) { setFilters({ starred: e.target.checked }); });
  $("tHideNo").addEventListener("change", function (e) { setFilters({ hideNo: e.target.checked }); });
  $("visitSeg").addEventListener("click", function (e) { var b = e.target.closest("button[data-visit]"); if (b) setFilters({ visit: b.getAttribute("data-visit") }); });
  $("visitSeg").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var order = ["all", "visited", "planned", "call", "none"], i = order.indexOf(S.visit), n = order[(i + (e.key === "ArrowRight" ? 1 : 4)) % 5];
    setFilters({ visit: n }); var nb = $("visitSeg").querySelector('[data-visit="' + n + '"]'); if (nb) nb.focus(); e.preventDefault();
  });
  // Beds: "2 bd" and "3 bd" toggle independently (both on = 2 or 3); "Any beds" clears them. "2-3" in the sheet matches either.
  $("bedsSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-beds]"); if (!b) return;
    var v = b.getAttribute("data-beds"), n = +v;
    var next = v === "any" ? [] : S.beds.indexOf(n) >= 0 ? S.beds.filter(function (x) { return x !== n; }) : S.beds.concat([n]);
    setFilters({ beds: next });
  });
  $("card").addEventListener("change", function (e) {
    var t = e.target;
    if (t && t.matches && t.matches("input[data-plan]")) saveChoice("plans", t.getAttribute("data-plan"), t.checked);
  });
  // Like / Dislike: pressing the active one clears it; pressing the other switches.
  $("card").addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest("button[data-pref]") : null;
    if (!b || b.disabled) return;
    var id = b.getAttribute("data-id"), l = S.listings.filter(function (x) { return x.id === id; })[0]; if (!l) return;
    var cur = l.starred ? "like" : l.disliked ? "dislike" : "none", v = b.getAttribute("data-pref");
    saveChoice("prefs", id, cur === v ? "none" : v);
  });
  setFilters({});
  $("sortSel").addEventListener("change", function (e) { S.sort = e.target.value; store.set("sort", S.sort); renderList(); });
  $("refreshBtn").addEventListener("click", function () { loadLive(true); });
  $("listToggle").addEventListener("click", function () { toggleList(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("card").hidden) clearSelection(); });
  function syncToggles() {
    var a = $("tSchools").checked, b = $("tHoods").checked, c = $("tStarred").checked, d = $("tHideNo").checked;
    if (a !== S.showSchools || b !== S.showHoods) { S.showSchools = a; S.showHoods = b; store.set("schools", a); store.set("hoods", b); setLayerVis(); renderLegend(); }
    if (c !== S.onlyStarred || d !== S.hideNo) setFilters({ starred: c, hideNo: d });
  }
  window.addEventListener("pageshow", syncToggles);
  window.addEventListener("load", function () { setTimeout(syncToggles, 0); });
  if (window.matchMedia) { var mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", applyTheme); }
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  loadData().then(function (D) {
    var cached = store.get("rows");
    var first = cached && cached.at > SNAP.at ? applyRows(cached.rows, cached.links, cached.fills || {}, "cache", cached.at) : applyRows(SNAP.rows, SNAP.links || null, SNAP.fills || {}, "snapshot", SNAP.at);
    return first.then(function () {
      setStatus(sourceLine());
      initMap(D);
      S.map.on("moveend", function () { if (S.showSchools) renderLegend(); });
      initShared();
      loadLive(false);
    });
  }).catch(function (e) {
    $("mapLoading").textContent = "The map data didn't load (" + (e && e.message ? e.message : "error") + "). Reload the page to try again.";
    setStatus("Map data didn't load", true);
  });
})();
</script>
</body></html>
