  - { id: nvidia-aiq, role: required, why: "Agentic orchestration, deep research, retrieval and deterministic citation verification" }
  - { id: oracle-ai-vector-search, role: required, why: "Semantic and hybrid retrieval over first-party and public evidence" }
  - { id: oracle-ai-database, role: required, why: "Primary store for content and embeddings" }
  - { id: oci-object-storage, role: required, why: "Source documents and processed artifacts" }
  - { id: oci-kubernetes-engine, role: required, why: "Runtime for ingestion, orchestration and AI services" }
  - { id: oci-generative-ai, role: required, why: "Reasoning and generation" }
  - { id: nvidia-nim, role: required, why: "Inference services on OCI GPU infrastructure" }
  - { id: oci-search-opensearch, role: optional, why: "Lexical search and filtering alongside vector retrieval" }
  - { id: oci-document-understanding, role: optional, why: "Extraction from filings and reports where sources arrive as documents" }
  - { id: oci-api-gateway, role: optional, why: "Exposure of the pack's APIs" }
  - { id: oci-functions, role: optional, why: "Asynchronous processing" }
  - { id: oci-streaming, role: optional, why: "Event-driven signal intake at volume" }
  - { id: nvidia-nemotron, role: optional, why: "Reasoning models where deployed through NIM" }
  - { id: oracle-cx, role: optional, why: "Account system of record at the ingress end and delivery target at the egress end — the pack supplies the external-signal half Oracle's own account intelligence deliberately does not" }
  - { id: oracle-ai-agent-studio, role: optional, why: "The approved pattern for a partner-developed agent to sit alongside Fusion — external agents are otherwise contractually barred" }

kpis:                                      # component 11 — ONE metric set
  # From the section deck's own statement of what the engagement measures: "Focus: accuracy +
  # confidence — what the PoC measures, against reviewer approve / reject". No figure is cleared;
  # the engagement had not started. Every figure prints "results to follow".
  - name: Reviewer agreement rate
    formula: "Approved opportunities ÷ opportunities presented for review, per period"
    baseline: "Established during the proof of value; no industry baseline exists — no vendor in this market publishes an accuracy figure for the implication step"
    figure: "results to follow"
    figure_status: to_follow
    caveat: "Measures plausibility at review time, not correctness after the fact. Stated as reviewer agreement, never as accuracy."
    source: section-deck-2026-09-11
  - name: Confidence calibration
    formula: "Reviewer agreement rate within each confidence band, compared against the band's stated confidence"
    baseline: "None. Nothing in this market, and nothing in the Oracle or NVIDIA baseline, emits a calibrated confidence number."
    figure: "results to follow"
    figure_status: to_follow
    caveat: "A true calibration claim needs realized-outcome capture, which is Scaling-tier. At PoV this measures band-to-reviewer consistency only."
    source: section-deck-2026-09-11
  - name: Account coverage
    formula: "In-scope accounts with at least one reviewed record in the period ÷ total in-scope accounts"
    baseline: "The client's current manual research coverage, established during the proof of value"
    figure: "results to follow"
    figure_status: to_follow
    caveat: "Coverage is the pack's own first-order claim — the manual process trades depth against breadth and this removes the trade."
    source: research-brief-2026-09-22
  context_anchor:
    statement: "Sellers spend 9% of the week researching prospects and 9% on preparation and planning — 18%, more than they spend meeting customers in person."
    attribution: "Salesforce State of Sales, 6th edition (n=4,050)"
    use: >-
      Context for the size of the job, never presented as a result of this pack. Every
      time-saved figure found in this market is vendor-sourced with no stated method; none may
      be reused.

