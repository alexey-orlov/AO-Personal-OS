# Account Insights — accelerator pack specification
# Produced by /oracle-packs:spec on 2026-09-22 and confirmed the same day (plugin 0.1.7).

meta:
  slug: account-insights
  name: Account Insights
  name_source: user:2026-09-22            # settled 2026-09-11; re-confirmed with triad A
  name_variants:
    site: Account Insights
    internal_slide: Account Insights App
    external: Account insights
    external_subheading: Accelerator App by SoftServe
    note: >-
      The name is settled and load-bearing: it carries the mini-site tile, the tracker row and
      slides 9-10 of the September section deck. The delivered one-pager PDF still reads
      "AI Signal-Impact Engine" and is retitled at its next rebuild. The name does NOT survive
      the supply-side and underwriting scenarios ("account" is the wrong noun there) — this is
      the binding constraint on how far the pack may widen under this name.
    source: user:2026-09-22
  roadmap_item_id: account-insights
  roadmap_block: Deep research & investigation
  source_engagement:
    customer: "<the delivery customer — a global logistics and supply-chain operator>"
    delivered: >-
      A 12-week contracted proof of concept on NVIDIA AI-Q over OCI, turning external signals and
      first-party account context into per-account opportunity and risk records with citations,
      scored for magnitude and confidence, reviewed in a purpose-built reviewer UI. Seven external
      data sources. Not started at the time of packaging; no results exist.
    divergence_line: >-
      The pack generalizes what one engagement configured: the signal sources, the account
      universe and the service catalog are per-client configuration, and the catalog mapping and
      cross-account ripple reasoning are the reusable core.
    divergence_from_pack: >-
      The engagement's signed statement of work describes an older shape — per-account executive
      briefings and discussion guides benchmarked against manually written "golden" reports. The
      delivery moved to signal-triggered per-account opportunity records, which is what the pack
      packages; the SoW document is stale rather than divergent (user:2026-09-22). The pack widens
      past the engagement in three ways the engagement did not need: an account-triggered entry
      point alongside the signal-triggered one, recurrence with delta reasoning, and the service-
      catalog mapping as a first-class configurable target.
    source: user:2026-09-22, sow-uc6, section-deck-2026-09-11
  status: confirmed
  spec_version: 1
  generated_with: { roadmap_version: 2026-09-18, catalog_version: 2026-09-18 }

clearance:
  customer_name_allowed:
    internal: true
    partner_print: false
    customer_site: false
    demo: false
  anonymized_descriptor: a global logistics and supply-chain operator
  internal_only_facts:
    - the customer name outside internal channels
    - the contract value of the proof of concept
    - the named accounts appearing in the reviewer UI screenshot
    - the seven named external data sources of the delivered configuration
  approvals: []
  source: user:2026-09-22

problem_solution:                          # component 1 — signed off via triad A, rewritten 2026-09-22
  problem: >-
    An account manager, a partnerships lead or a portfolio manager each covers dozens of companies
    and cannot keep up with the news, filings and updates landing on all of them.
  problem_points:
    - label: Too much to keep up with
      text: dozens of companies, hundreds of sources, one person
    - label: Found out too late
      text: the update surfaces after the company has already decided
    - label: Only the company in the headline
      text: what it means for its suppliers, customers, competitors or sister holdings is never worked out
  solution: >-
    Each morning they see the handful of changes that matter across the companies they cover —
    what each one means and what to do about it — and review that list instead of assembling it.
  outcome_chips: ["Coverage ↑", "Time to first move ↓", "Second-order opportunities surfaced"]
  reframe: "Review the opportunity, don't research it"
  note: >-
    Rewritten after Alex called the first version "waterish" (2026-09-22). The original named an
    abstract activity — "commercial teams work out what a development means for their accounts by
    hand" — instead of the role and the concrete things piling up on that person. Test to apply:
    could an account manager say this sentence about their own week? Widened 2026-09-22 from the
    account-manager seat alone to the three seats the same job has.
  source: user:2026-09-22

one_liner:                                 # component 2 — re-proposed 2026-09-22 under the three-question rule (plugin 0.1.9); shown to the owner, not objected to; flagged on the artifact review
  full: >-
    More opportunities from the companies you already track: the news, filings and updates on them
    become a named next move for each — scored, cited and reviewed before anything reaches your
    systems.
  short: "More opportunities from the companies you already track — found in the news, filings and updates on them."
  banned_words_checked: true
  note: >-
    Of what — the news, filings and updates on the accounts you cover. So what for the business —
    more opportunities from accounts you already have. How, in one clause — turned into named
    services to offer, scored, cited and reviewed. No qualifier from the source engagement. The
    signed-off first version ("Turns market events into named opportunities…, scored and cited for
    review") answered of-what and how but stated no business outcome. Widened 2026-09-22 from "the
    accounts you already cover … named services to offer" to the three seats — sales, partnerships,
    portfolio — on the owner's correction.
  source: user:2026-09-22

icp:                                       # component 3 — signed off
  line: "Any team responsible for a named set of companies it has to stay current on — the accounts it sells to, the partners it develops, or the companies in its portfolio."
  buyer_roles: [Chief Commercial Officer, VP Sales, Head of Key Accounts, Head of Partnerships, Head of Business Development, Portfolio Operations Lead, Head of Sales Operations]
  qualifying_signals:
    - "A named, finite set of companies the team is responsible for — accounts, partner prospects or holdings — owned by people, not a total addressable market"
    - "A real catalog of moves the team can make in response — services to sell, partnership offers to propose, value-creation levers to pull"
    - "Research on those companies is done today by the people who own the relationship, not by a central research function"
    - "A system of record holding first-party context worth grounding against — a CRM, a deal pipeline, a portfolio tracker"
    - "Companies whose own suppliers, customers, competitors or sister holdings are also in the set — this is what makes ripple reasoning pay"
  disqualifiers:
    - "No catalog of moves to map to — a fund screening deal targets has nothing to map an implication onto"
    - "Open, undiscovered universes: the pack resolves signals against a roster it is given; it does not go and find new names"
    - "Teams wanting an action taken automatically — the pack informs decisions, it does not act on them"
    - "Teams already standardized on a first-party-only intelligence tool with no appetite for external signal"
  note: >-
    Stated as a shape across three seats — sales, partnerships, portfolio — so it holds across the
    industries. The last qualifying signal is the differentiator restated as a qualification
    question.
  source: user:2026-09-22

verticals:                                 # component 5 — PROPOSED, see open_questions/verticals
  - name: Logistics & supply chain
    site_label: Logistics
    framing:
      problem: "Account teams learn about a customer's plant expansion, market entry or disruption after the logistics decision is already made."
      solution: "Signals on shippers and their networks become named forwarding, warehousing and contract-logistics opportunities on the accounts that carry them."
      entities: "customer accounts, service lines, trade lanes, sites"
    catalog_type: offering
    status: plausible
    source: one-pager-2026-09-10, sow-uc6
  - name: Financial services & banking
    site_label: Financial services
    framing:
      problem: "A relationship manager finds out about a counterparty event from the client, not from the bank."
      solution: "One event is resolved across the obligor group and returns both the coverage opportunity and the exposure it puts at risk, to two different owners."
      entities: "obligor groups, exposures, product holdings"
    catalog_type: offering
    status: plausible
    note: >-
      The one scenario where a signal must produce an opportunity AND a risk, routed separately —
      neither may suppress the other. Shipping that is a roadmap row (dual-implication routing),
      so this vertical sells at the Integration tier, not the PoV.
    source: research-brief-2026-09-22
  - name: Industrial & manufacturing
    site_label: Manufacturing
    framing:
      problem: "A supplier or OEM customer event reshapes demand across several accounts at once, and it is worked out one account at a time or not at all."
      solution: "One signal fans out across the affected account base with the reallocation and supply-chain opportunities each one creates."
      entities: "accounts, production sites, trade lanes"
    catalog_type: offering
    status: plausible
    source: one-pager-2026-09-10
  - name: Private equity funds
    site_label: Private equity
    framing:
      problem: "A market or regulatory event moves the thesis on a portfolio company, and the fund finds out at the next board meeting."
      solution: "Signals across the portfolio are resolved to the holdings they affect and mapped to the value-creation levers the fund actually pulls."
      entities: "portfolio companies, investment theses, value-creation levers"
    catalog_type: lever
    status: plausible
    scope_note: >-
      SCOPED TO PORTFOLIO MONITORING ONLY (user:2026-09-22). The delivered one-pager's second PE
      example — event-driven screening of pipeline targets — is deliberately dropped: a fund
      screening deal targets has no catalog to map an implication onto, so step 6 is absent
      rather than different, and that is the one step this pack is differentiated on. Screening
      also needs an open, discovered universe, while the pack resolves signals against a roster.
    tier_note: >-
      Sells at Integration, not PoV. Mapping to a value-creation lever rather than an offering
      needs the configurable catalog target, which is a roadmap row today. Until it ships, this
      vertical is truthful only if the lever set is captured as the client's catalog — which is
      a per-engagement configuration, not a product capability. Do not print this vertical as
      PoV-available on any artifact.
    source: one-pager-2026-09-10, user:2026-09-22

capabilities:                              # component 6 — Area > Category > Feature
  # Grouped 2026-09-22 from 52 features to 24 rows so the feature list fits one A4 page (Alex:
  # "always think about generalizing and grouping to meet this requirement"). Peers of the same
  # status inside a category were merged and the merged tasks are named inside the row; the
  # 52-row tree survives in git history and, feature by feature, in oracle-baseline-lens.md.
  # Glyphs per decisions-2026-09-18: ● available · ◐ partial · ○ roadmap.
- area: Account universe & grounding
  stage: Ground it
  customization_scope_area: In-scope account list definition · CRM field mapping and account-framing extraction
    · Per-client service-catalog capture · Signal-source selection and licensing review
  categories:
  - name: The account universe
    features:
    - name: Account universe — in-scope list, tiering, relationship framing from CRM
      status: partial
      tier_first_available: pov
      note: An agreed CRM extract at PoV Jumpstart; API at Integration
      source: one-pager-2026-09-10, reviewer-ui-2026-09-11
  - name: Sources
    features:
    - name: Signal sources — news, filings, disclosures, commercial feeds, EDGAR and IR pages
      status: partial
      tier_first_available: pov
      note: A bounded, licence-cleared source set at PoV Jumpstart; the client's own licensed feeds at Integration
      source: one-pager-2026-09-10
    - name: Service-line catalog captured from the client's own material
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10
    - name: Grounding roadmap — legal-entity grouping, source-licensing gate, native multilingual
      status: roadmap
      source: one-pager-2026-09-10, research-brief-2026-09-22
- area: Signal intake & normalization
  stage: Normalize it
  customization_scope_area: Relevance rules and thresholds per client · Account-matching rules · Cadence and source
    configuration · Signal-type catalog definition
  categories:
  - name: Trigger
    features:
    - name: Trigger — scheduled scan, manual submit, on demand for one account
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10, research-brief-2026-09-22
    - name: Standing subscription — recurrence, deadline-bound triggers, what changed since last time
      status: roadmap
      tier_first_available: integration
      source: research-brief-2026-09-22
  - name: Normalization
    features:
    - name: Normalization — genuine, de-duplicated, resolved to the accounts affected, one record each
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10
    - name: Provenance class — filing · disclosure · reported · rumour · model output
      status: roadmap
      source: research-brief-2026-09-22
- area: Implication reasoning
  stage: Reason it
  customization_scope_area: Reasoning prompts per domain · Ripple rules per domain · Client catalog and mapping
    logic · Scoring rubric and thresholds per client
  categories:
  - name: Evidence
    features:
    - name: Evidence assembly and ranking across first-party and public sources
      status: available
      tier_first_available: pov
      source: one-pager-2026-09-10
    - name: Evidence and reasoning safeguards — the evidence set shown, contradictions surfaced, conclusions checked,
        opportunity and risk routed separately
      status: roadmap
      source: research-brief-2026-09-22
      tier_first_available: integration
  - name: The implication
    features:
    - name: Opportunity and risk reasoning — the "so what" per account
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10
  - name: Catalog mapping
    features:
    - name: Opportunity mapped to a named service line the client actually sells
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10, reviewer-ui-2026-09-11
    - name: Catalog flexibility — a configurable mapping target, and "mapped to nothing" emitted as a demand-gap
        stream
      status: roadmap
      source: research-brief-2026-09-22
  - name: Ripple
    features:
    - name: Cross-account ripple, descriptive, up to two levels
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10
    - name: Ripple at scale — a licensed relationship graph, portfolio-level aggregation
      status: roadmap
      tier_first_available: scaling
      source: research-brief-2026-09-22
  - name: Scoring
    features:
    - name: Magnitude and confidence scored 0–10 per item
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10, reviewer-ui-2026-09-11
    - name: Scoring maturity — confidence calibrated on realized outcomes, cost-aware ranking
      status: roadmap
      source: research-brief-2026-09-22
- area: Review & evidence
  stage: Review it
  customization_scope_area: Reviewer layout and workflow configuration · Evaluation set and rubric per client ·
    Feedback fields per workflow
  categories:
  - name: The reviewer
    features:
    - name: Reviewer UI with cited evidence and visible reasoning — approve / reject with a comment
      status: available
      tier_first_available: pov
      source: reviewer-ui-2026-09-11, one-pager-2026-09-10
    - name: Reviewer workbench — triage before anything is written; disagreement analysed as a signal
      status: roadmap
      source: research-brief-2026-09-22
  - name: Evaluation
    features:
    - name: Evaluation — correctness and calibration harness, reviewer feedback captured as input
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10
    - name: Evidence integrity — point-in-time replay, negative assertion, retraction re-check, feedback-driven
        tuning
      status: roadmap
      tier_first_available: scaling
      source: one-pager-2026-09-10, research-brief-2026-09-22
- area: Output & delivery
  stage: Deliver it
  customization_scope_area: Output schema per client · Integration configuration per target system · Routing and
    ownership rules
  categories:
  - name: The record
    features:
    - name: Output — a structured per-account record or a narrative briefing, filtered by confidence
      status: partial
      tier_first_available: pov
      source: one-pager-2026-09-10, sow-uc6
  - name: Delivery
    features:
    - name: Export to the client's sales system
      status: partial
      tier_first_available: integration
      note: File export at PoV Jumpstart; API export is Integration-tier scope
      source: one-pager-2026-09-10
    - name: Downstream maturity — routing to the account owner, live write-back, outcome capture, and eventually
        acting on opportunities
      status: roadmap
      tier_first_available: integration
      note: Integration and Scaling tiers; nothing is written back in the proof of value
      source: research-brief-2026-09-22, one-pager-2026-09-10

workflow:                                  # component 7 — PROPOSED
  inputs:
    - system: The client's CRM
      data: "in-scope account list, account framing and relationship notes, owner per account"
      tier: "PoV Jumpstart: an agreed extract. Integration: API."
    - system: External signal sources
      data: "news, regulatory filings, disclosures, commercial data feeds"
      tier: "PoV Jumpstart: a bounded, licence-cleared source set. Integration: the client's own licensed feeds."
    - system: The client's service catalog
      data: "service lines and offerings, captured from the client's own material"
      tier: "PoV Jumpstart: captured once. Integration: maintained against a versioned catalog."
  outputs:
    - system: The client's sales system
      data: "approved per-account records — account, trigger, impact reasoning, scored opportunities with service-line mapping and cross-account effects"
      tier: "PoV Jumpstart: file export / download. Integration: API export. Scaling: live write-back with idempotency."
  steps:
    - n: 1
      name: Set the scope
      actor: human
      human_in_the_loop: true
      covers: "the in-scope account list and its owners, the signal sources, and the client's own service catalog"
      description: >-
        The client names the accounts that are in scope and who owns each, agrees the signal
        sources and their licensing, and hands over the service catalog an implication can be
        mapped onto.
      failure_path: >-
        An account with no CRM framing is admitted and flagged as thinly grounded, never silently
        dropped. A source that cannot be licensed for model use and redistribution is excluded at
        this step rather than discovered at procurement.
    - n: 2
      name: Pick up the signal
      actor: system
      covers: "ingestion, relevance filtering, de-duplication, account resolution, fan-out"
      description: >-
        Signals arrive on a schedule, on demand for one account, or by manual submit. Each is
        judged genuine, de-duplicated across sources into one signal, and resolved to the in-scope
        accounts it actually concerns — one record per affected account.
      failure_path: >-
        A name matching two accounts or none goes to human triage, never a guess. An unreachable
        or paywalled source is recorded as unreachable, never as "nothing found" — a feed that is
        down must not read as a quiet week.
    - n: 3
      name: Work out what it means
      actor: system
      covers: "evidence assembly and ranking, the \"so what\" per account, second-order ripples"
      description: >-
        Evidence is assembled and ranked from first-party and public sources, the implication is
        reasoned for that account as opportunities and risks, and the effect is followed to the
        account's suppliers, customers and competitors that are themselves in the book.
      failure_path: >-
        NOT COVERED, by this pack or by any product in this market — citation verification proves
        the quote is real, nothing proves the business conclusion follows from it. The reviewer at
        step 5 is the only check, which is why that step is not optional. Beyond two levels, or
        with no relationship data, a ripple is stated as unknown rather than asserted.
    - n: 4
      name: Map it to what you sell
      actor: system
      covers: "service-line mapping, and the demand gap when nothing fits"
      description: >-
        Each implication is mapped to a named service line the client actually sells, so the
        output is something to go and do rather than something to read.
      failure_path: >-
        An implication that maps to nothing is emitted as mapped-to-nothing — never forced onto
        the nearest catalog entry. Where a vertical has no catalog the step is switched off rather
        than faked.
    - n: 5
      name: Score it, evidence it, review it
      actor: human
      human_in_the_loop: true
      covers: "magnitude and confidence, citations, the reviewer's approve / reject with a reason"
      description: >-
        Each item carries a magnitude, a confidence and its source evidence; the reviewer reads the
        short list and approves, rejects or comments on why something is or is not pursuable.
      failure_path: >-
        Below the confidence threshold an item is filtered rather than delivered, and the filtered
        count is reported so silence stays legible. A rejection is retained with its reason, never
        deleted. Contradiction between reliable sources is currently resolved by rank order rather
        than surfaced as a finding — roadmap.
    - n: 6
      name: Deliver it and learn from it
      actor: system
      covers: "routing to the account owner, export to the sales system, outcome capture"
      description: >-
        Approved records reach the person who owns that account, in the system they work in, and
        what became of each one feeds back into scoring.
      failure_path: >-
        In the proof of value nothing is written back — reviewer decisions are captured, not
        persisted. Routing is Integration tier; misrouting is the most common way a correct
        implication produces no action. Outcome capture is Scaling tier, and without it the
        confidence score can only ever be asserted, never calibrated.
  grouping_note: >-
    Six steps, not twelve (Alex, 2026-09-22: a workflow is grouped to 5-7). Each step names what
    it covers so the finer operations stay visible without becoming the spine. The feature-level
    view lives in `capabilities`, whose five areas are the same process cut one level down.

architecture:                              # component 8 — PROPOSED
  inputs:
    - system: Signal feeds
      data: "news, filings, disclosures, commercial data feeds"
    - system: Client context
      data: "CRM account records and framing, service-line catalog"
  outputs:
    - system: Sales systems
      data: "structured per-account records"
  stack:
    - layer: Custom configuration
      vendor: SoftServe
      items: ["In-scope account list and tiering", "Reasoning and ripple rules per domain", "Service catalog capture and mapping logic", "Scoring rubric and thresholds"]
    - layer: Accelerator business app
      vendor: Oracle + SoftServe
      summary: "normalize · fan out · reason · map · score · reviewer UI"
      items: ["Signal normalization and account resolution", "Catalog mapping and ripple reasoning", "Magnitude and confidence scoring", "Reviewer UI and evaluation harness"]
    - layer: Agentic engine
      vendor: NVIDIA
      catalog_id: nvidia-aiq
      items: ["Agentic orchestration and deep research", "Retrieval, reranking and citation verification"]
      note: >-
        AI-Q requires the RAG Blueprint deployed first. NVIDIA's AI-Q-on-OCI Terraform and Helm
        samples are published as community examples and are explicitly NOT covered by NVIDIA
        Enterprise Support — material to any architecture claim made to an Oracle audience.
    - layer: Cloud infrastructure and GPUs
      vendor: Oracle
      catalog_id: [oci-dedicated-ai-cluster, oci-kubernetes-engine, oci-object-storage, oracle-ai-database, oci-api-gateway]
      items: ["OCI dedicated AI cluster — reserved GPU capacity for the engine", "OCI Kubernetes Engine for the pack's services", "Object Storage for sources and artifacts, Oracle AI Database for the retrieval index", "API Gateway for exposure"]

oracle_products:                           # components 9 and 10 — catalog ids only, Oracle vendor only
  # Applied item by item against the schema's definitions (0.1.7): required = only what the pack
  # cannot run without — the platform as one entry plus what the core executes on; optional = only
  # what a buyer would plausibly connect as a source or destination.
  # Read each entry back as a sentence before keeping it. The first draft of this list carried
  # 5 required and 7 optional, filled from the source engagement's technology stack rather than
  # against these definitions — "the pack is built on OCI API Gateway" is not a true sentence
  # (Alex, 2026-09-22). Object storage, OKE, Functions, API Gateway, Streaming and OpenSearch are
  # plumbing any OCI deployment implies, not products the pack is built on; OCI Generative AI is
  # an alternative inference path, not a source or destination. All are out.
  # NVIDIA AI-Q, NIM and Nemotron are the pack's engine and are carried in architecture.stack[].

  - id: oci
    role: required
    why: "The tenancy the pack runs in — OCI Kubernetes Engine for the services, Object Storage for sources and artifacts, Oracle AI Database for the index, API Gateway for exposure; each is a row on the architecture's infrastructure layer, the platform is this one entry"
    integration: "Every tier."

  - id: oci-dedicated-ai-cluster
    role: required
    why: "The pack's engine runs on reserved GPU capacity here — this is the Oracle dependency, and the commercial hook: the engagement lands as client-committed cluster capacity"
    integration: "PoV Jumpstart and every tier above. There is no version of this pack that does not run on it."

  - id: oracle-ai-vector-search
    role: optional
    why: "The natural Oracle home for the pack's retrieval index. Optional, not required — NVIDIA's own AI-Q-on-OCI reference deployment ships Milvus, so the Oracle store is a deliberate substitution and a real upsell, never an assumption"
    integration: "Integration tier, where the index moves off the reference stack onto the customer's own Oracle estate."

  - id: oracle-cx
    role: optional
    why: "The account system of record at the ingress end and the delivery target at the egress end — the pack supplies the external-signal half that Oracle's own account intelligence is first-party-only by design"
    integration: "PoV Jumpstart: an agreed extract in, file out. Integration: API both ways."
    note: >-
      The single most commercially relevant entry on this list, and the one that carries the
      anchor story. `optional` by precedent: the owner moved Oracle Fusion Field Service to
      optional on the workforce pack the same day (plugin 0.1.5) — a system the pack reads from or
      writes to is optional even when it is the go-to-market anchor. The customer's CRM may be
      Salesforce or anything else, and nothing in the pack is bound to Oracle's.

  - id: oracle-ai-agent-studio
    role: optional
    why: "The approved pattern for a partner-developed agent to sit alongside Fusion — external agents and MCP are otherwise contractually barred from Fusion"
    integration: "Integration tier, and only for customers running Fusion. Not a dependency of the pack itself."

kpis:                                      # component 11 — ONE metric set
  # From the section deck's own statement of what the engagement measures: "Focus: accuracy +
  # confidence — what the PoC measures, against reviewer approve / reject". No figure is cleared;
  # the engagement had not started. Every figure prints "results to follow".
  - name: Reviewer agreement rate
    formula: "Approved opportunities ÷ opportunities presented for review, per period"
    baseline: "Established during the proof of value; no industry baseline exists — no vendor in this market publishes an accuracy figure for the implication step"
    figure: "-"
    note: "Measures plausibility at review time, not correctness after the fact. Stated as reviewer agreement, never as accuracy."
    source: section-deck-2026-09-11
  - name: Confidence calibration
    formula: "Reviewer agreement rate within each confidence band, compared against the band's stated confidence"
    baseline: "None. Nothing in this market, and nothing in the Oracle or NVIDIA baseline, emits a calibrated confidence number."
    figure: "-"
    note: "A true calibration claim needs realized-outcome capture, which is Scaling-tier. At PoV this measures band-to-reviewer consistency only."
    source: section-deck-2026-09-11
  - name: Account coverage
    formula: "In-scope accounts with at least one reviewed record in the period ÷ total in-scope accounts"
    baseline: "The client's current manual research coverage, established during the proof of value"
    figure: "-"
    note: "Coverage is the pack's own first-order claim — the manual process trades depth against breadth and this removes the trade."
    source: research-brief-2026-09-22
  # CONTEXT ANCHOR — not a metric of this pack, and never printed as one.
  # "Sellers spend 9% of the week researching prospects and 9% on preparation and planning —
  # 18%, more than they spend meeting customers in person." Salesforce State of Sales, 6th ed.
  # (n=4,050). Usable to size the job. Every time-saved figure in this market is vendor-sourced
  # with no stated method; none may be reused.

packages:                                  # component 12
  tier_vocabulary_note: "PoV Jumpstart / Integration / Scaling per decisions-2026-09-18. S/M/L survive only as internal size tags."
  tiers:
    - id: pov
      name: PoV Jumpstart
      size_tag: S
      scope_line: "One signal set, one account segment, file-based in and out: prove the reviewer agrees."
      duration_weeks: { target: 8, min: 6, max: 8, hard_cap: 10 }
      duration_note: >-
        Signed off at 6-8 weeks (user:2026-09-22), deliberately narrower than the source
        engagement's contracted 12 weeks, which exceeds the 10-week cap. The 12-week engagement
        is the full-scope shape and sits a tier above.
      services_price: { status: tbd, footnote: "No price set. The source engagement's contract value is an internal-only fact and is not a published tier price." }
      infra_price_monthly: { status: tbd, footnote: "Depends on signal volume, account count and source licensing." }
      what_you_get:
        - "Reviewed opportunity records across one real account segment, on the client's own accounts and catalog"
        - "A reviewer agreement and confidence-calibration readout from the client's own reviewers"
        - "The reviewer UI running in a sandboxed environment on the client's own tenancy"
        - "A costed plan for the next step: integration scope, source licensing, routing"
      entry_gate:
        - "A named in-scope account segment with CRM framing that can be extracted"
        - "The client's own service-line catalog, or the material it can be captured from"
        - "A licence-cleared signal source set — rights to put the source into a model and redistribute the output"
        - "Reviewers who will actually review, and whose approve / reject is the acceptance measure"
      scope_in:
        - "Signal ingestion and grounding against the client's own CRM extract and catalog"
        - "Signal normalization — relevance, de-duplication and account resolution"
        - "Opportunity and risk reasoning mapped to a named service line"
        - "Descriptive cross-account ripple, up to two levels"
        - "Magnitude and confidence scoring with citations"
        - "Reviewer UI and the evaluation harness"
      scope_out:
        - "Acting on opportunities — auto-outreach, task creation, workflow automation"
        - "Validating candidates against the client's existing pipeline"
        - "Monetary sizing and interactive question-and-answer over the output"
        - "Live CRM write-back and a persistent historical signal store"
        - "Deep financial or quantitative modeling"
        - "Native multilingual processing"
        - "Routing to the account owner, and outcome capture — Integration and Scaling tiers"
    - id: integration
      name: Integration
      size_tag: M
      scope_line: "Wire it into the account team's working day: the client's own licensed feeds in, the client's sales system out."
