open_questions:
  - id: verticals
    question: "Keep private equity funds as the fourth vertical, or replace it with professional & business services?"
    why: "A fund screening deal targets has no service catalog to map an implication onto — step 6 is absent there, which contradicts the pack's own differentiator. The delivered one-pager and the section deck both carry PE."
    blocks: [verticals, capabilities.catalog_mapping, one_pager, deck, listing]
  - id: pe_catalog_target
    question: "Does the configurable catalog target (offering · lever · mitigation · none) get pulled forward out of roadmap?"
    why: >-
      The private equity vertical was kept (user:2026-09-22) scoped to portfolio monitoring, which
      maps implications to a value-creation lever rather than a service offering. That mapping is
      only honest once the catalog target is configurable; today it is a roadmap row, so the
      vertical is Integration-tier and must not be printed as PoV-available.
    blocks: [verticals, capabilities.catalog_mapping, one_pager, deck, listing]
  - id: internal_contact
    question: "Who is the internal contact, and at which address?"
    why: "The section deck prints RnDrequest@softserveinc.com, which appears in no source file; the address on record for Bohdan Khomych is bkhomy@."
    blocks: [deck, exec_summary, one_pager]
  - id: aiq_version
    question: "Which AI-Q version does the delivery pin?"
    why: "Research passes disagree on whether a research-plan approval step exists; 2.1.0 documents a Clarifier agent, the develop changelog removes it. The pack's reviewer UI is unaffected either way, but no artifact should print an AI-Q capability without this."
