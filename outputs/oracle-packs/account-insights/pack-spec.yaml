  - id: oracle_anchor
    question: "Is Oracle Sales Command Center the distribution rail for this pack, and does the partner carve-out in AI Agent Studio cover it?"
    why: "Sales Command Center is first-party-only by design, which makes the external-signal half white space rather than a race. Confirming it turns a standing open loop into the pack's Oracle story."
    blocks: [architecture, oracle_products, deck]
  - id: pov_price
    question: "What is the PoV Jumpstart price?"
    why: "Left tbd deliberately — the source engagement's contract value is internal-only and is not a published tier price. Every artifact prints a footnote instead of a number until this is set."
    blocks: [packages, one_pager, deck, listing]
  - id: source_licensing
    question: "What is the standing answer on source licensing rights?"
    why: "Absent from the whole pipeline and a procurement blocker for enterprise buyers. The source engagement capped third-party data at three sources and a small budget, which is a PoV constraint, not a product answer."
