# Account Insights — accelerator pack specification
# Produced by /oracle-packs:spec on 2026-09-22. Components carrying `user:2026-09-22`
# are signed off; the rest are proposals awaiting sign-off.

meta:
  slug: account-insights
  name: Account Insights
  name_source: user:2026-09-22            # settled 2026-09-11; re-confirmed with triad A
  name_variants:
    site: Account Insights
    internal_slide: Account Insights App
    external: Account insights
    external_subheading: Accelerator App by SoftServe
    note: >-
      The name is settled and load-bearing: it carries the mini-site tile, the tracker row and
      slides 9-10 of the September section deck. The delivered one-pager PDF still reads
      "AI Signal-Impact Engine" and is retitled at its next rebuild. The name does NOT survive
      the supply-side and underwriting scenarios ("account" is the wrong noun there) — this is
      the binding constraint on how far the pack may widen under this name.
    source: user:2026-09-22
  roadmap_item_id: account-insights
  roadmap_block: Deep research & investigation
  source_engagement:
    customer: "<the delivery customer — a global logistics and supply-chain operator>"
    delivered: >-
      A 12-week contracted proof of concept on NVIDIA AI-Q over OCI, turning external signals and
      first-party account context into per-account opportunity and risk records with citations,
      scored for magnitude and confidence, reviewed in a purpose-built reviewer UI. Seven external
      data sources. Not started at the time of packaging; no results exist.
    divergence_line: >-
      The pack generalizes what one engagement configured: the signal sources, the account
      universe and the service catalog are per-client configuration, and the catalog mapping and
      cross-account ripple reasoning are the reusable core.
    divergence_from_pack: >-
      The engagement's signed statement of work describes an older shape — per-account executive
      briefings and discussion guides benchmarked against manually written "golden" reports. The
      delivery moved to signal-triggered per-account opportunity records, which is what the pack
      packages; the SoW document is stale rather than divergent (user:2026-09-22). The pack widens
      past the engagement in three ways the engagement did not need: an account-triggered entry
      point alongside the signal-triggered one, recurrence with delta reasoning, and the service-
      catalog mapping as a first-class configurable target.
    source: user:2026-09-22, sow-uc6, section-deck-2026-09-11
  status: draft
  spec_version: 1
  generated_with: { roadmap_version: 2026-09-18, catalog_version: 2026-09-18 }

clearance:
  customer_name_allowed:
    internal: true
    partner_print: false
    customer_site: false
    demo: false
  anonymized_descriptor: a global logistics and supply-chain operator
  internal_only_facts:
    - the customer name outside internal channels
    - the contract value of the proof of concept
    - the named accounts appearing in the reviewer UI screenshot
    - the seven named external data sources of the delivered configuration
  approvals: []
  source: user:2026-09-22

problem_solution:                          # component 1 — signed off via triad A
  problem: >-
    Commercial teams work out what a market development means for their accounts by hand — slowly,
    inconsistently, and only ever for the account the news is about.
  problem_points:
    - label: Late and partial
      text: research happens before a meeting, not when the event breaks
    - label: Blind to second order
      text: the effect on that account's supplier, customer or competitor is never worked out
    - label: Not tied to the offer
      text: a signal becomes a paragraph, not a named service someone can go and sell
  solution: >-
    Every signal is resolved against your own account universe, reasoned into opportunities and
    risks, mapped to a service line you actually sell, scored for magnitude and confidence and
    cited to its source — then put in front of a reviewer before anything reaches the CRM.
  outcome_chips: ["Account coverage ↑", "Time to first contact ↓", "Second-order opportunities surfaced"]
  reframe: "Review the opportunity, don't research it"
  source: user:2026-09-22

one_liner:                                 # component 2 — signed off via triad A
  full: >-
    Turns market events into named opportunities on the accounts you already cover — each mapped
    to a service you sell, scored and cited for review.
  short: "Market events, turned into named opportunities on the accounts you cover."
  banned_words_checked: true
  note: >-
    States the job and the outcome in the buyer's words. Carries no count, no tier vocabulary and
    no packaging language (anti-pattern A1). The delivered one-pager's opening ("turns a real-world
    signal into structured, machine-readable JSON") leads with the output format rather than the
    outcome and is replaced.
  source: user:2026-09-22

icp:                                       # component 3 — PROPOSED, not yet signed off
  line: "Any organization selling a catalog of services into a named book of accounts it has to stay current on."
  buyer_roles: [Chief Commercial Officer, VP Sales, Head of Key Accounts, Head of Sales Operations, Head of Commercial Excellence]
  qualifying_signals:
    - "A named, finite account book — accounts are owned by people, not a total addressable market"
    - "A real service or product catalog that a signal could be mapped onto"
    - "Account research is currently done by the account team itself, not by a central research function"
    - "A CRM that holds first-party account framing worth grounding against"
    - "Accounts whose own suppliers, customers and competitors are also in the book — this is what makes ripple reasoning pay"
  disqualifiers:
    - "No catalog to map to — a fund screening deal targets has nothing at step 6 (see verticals)"
    - "Open, undiscovered universes: the pack resolves signals against a roster, it does not go and find new names"
    - "Buyers wanting an action taken automatically — the pack informs decisions, it does not act on them"
    - "Buyers already standardized on a first-party-only account intelligence tool with no appetite for external signal"
  note: >-
    Deliberately stated as a shape, not an industry, so it holds across the verticals. The last
    qualifying signal is the differentiator restated as a qualification question.
  source: research-brief-2026-09-22

verticals:                                 # component 5 — PROPOSED, see open_questions/verticals
  - name: Logistics & supply chain
    site_label: Logistics
    framing:
      problem: "Account teams learn about a customer's plant expansion, market entry or disruption after the logistics decision is already made."
      solution: "Signals on shippers and their networks become named forwarding, warehousing and contract-logistics opportunities on the accounts that carry them."
      entities: "customer accounts, service lines, trade lanes, sites"
    catalog_type: offering
    source: one-pager-2026-09-10, sow-uc6
  - name: Financial services & banking
    site_label: Financial services
    framing:
      problem: "A relationship manager finds out about a counterparty event from the client, not from the bank."
      solution: "One event is resolved across the obligor group and returns both the coverage opportunity and the exposure it puts at risk, to two different owners."
      entities: "obligor groups, exposures, product holdings"
    catalog_type: offering
    note: >-
      The one scenario where a signal must produce an opportunity AND a risk, routed separately —
      neither may suppress the other. Shipping that is a roadmap row (dual-implication routing),
      so this vertical sells at the Integration tier, not the PoV.
    source: research-brief-2026-09-22
  - name: Industrial & manufacturing
    site_label: Manufacturing
    framing:
      problem: "A supplier or OEM customer event reshapes demand across several accounts at once, and it is worked out one account at a time or not at all."
      solution: "One signal fans out across the affected account base with the reallocation and supply-chain opportunities each one creates."
      entities: "accounts, production sites, trade lanes"
    catalog_type: offering
    source: one-pager-2026-09-10
  - name: Professional & business services
    site_label: Professional services
    framing:
      problem: "Client-development teams read about a client's new jurisdiction, regulation or transaction too late to be the ones who raised it."
      solution: "Signals on the client base become named practice-area and service-line approaches, with the conflict and eligibility checks that must run first."
      entities: "client organizations, matters, practice areas"
    catalog_type: offering
    note: >-
      Proposed as the replacement for the delivered one-pager's fourth vertical (private equity
      funds), which fails this pack's own thesis: a fund screening deal targets has no service
      catalog to map an implication onto — step 6 is ABSENT there, not merely different. See
      open_questions/verticals.
    source: research-brief-2026-09-22

capabilities:                              # component 6 — Area > Category > Feature
  # `oracle_pack` is the Oracle + NVIDIA AI-Q baseline's own coverage, corrected 2026-09-22
  # against NVIDIA and Oracle primary documentation. The delivered one-pager marked exactly one
  # feature as provided by the baseline; the evidence puts the tally at full 3 / partial 5 /
  # none 4 across the workflow. Glyphs per decisions-2026-09-18: ● available · ◐ partial · ○ roadmap.

  - area: Account universe & grounding
    stage: Ground it
    customization_scope_area: >-
      In-scope account list definition · CRM field mapping and account-framing extraction ·
      Per-client service-catalog capture · Signal-source selection and licensing review
    categories:
      - name: The account universe
        features:
          - { name: In-scope account list and tiering, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Account framing from CRM (the relationship in the client's own words), status: partial, oracle_pack: none, tier_first_available: pov, source: reviewer-ui-2026-09-11 }
          - { name: Entity grouping by legal hierarchy rather than name match, status: roadmap, oracle_pack: none, specificity: [use_case], source: research-brief-2026-09-22 }
      - name: Sources
        features:
          - { name: Signal ingestion — news, filings, disclosures, status: partial, oracle_pack: partial, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Commercial data feeds, status: partial, oracle_pack: partial, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Public filings via EDGAR and IR pages, status: partial, oracle_pack: partial, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Service-line capability catalog from the client's own material, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Source-licensing and redistribution-rights gate, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Native multilingual processing, status: roadmap, oracle_pack: partial, source: one-pager-2026-09-10 }

  - area: Signal intake & normalization
    stage: Normalize it
    customization_scope_area: >-
      Relevance rules and thresholds per client · Account-matching rules · Cadence and
      source configuration · Signal-type catalog definition
    categories:
      - name: Trigger
        note: "Both entry points. The account-triggered path is the widening the pack adds over the delivered engagement."
        features:
          - { name: Signal-triggered — scheduled scan and manual submit, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Account-triggered — research one account on demand or before a meeting, status: partial, oracle_pack: available, tier_first_available: pov, source: research-brief-2026-09-22 }
          - { name: Recurrence as a standing subscription per account, status: roadmap, oracle_pack: none, tier_first_available: integration, source: research-brief-2026-09-22 }
          - { name: Deadline-bound trigger — emit ahead of a dated instrument with no new signal, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
      - name: Normalization
        note: "Relevance filtering, de-duplication and entity resolution merged into one step — you cannot judge relevance before you know which entity the story is about."
        features:
          - { name: Relevance filter — is this a genuine signal, status: partial, oracle_pack: partial, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: De-duplication — one story across many sources becomes one signal, status: partial, oracle_pack: partial, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Account resolution — which in-scope accounts a signal affects, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Fan-out — one signal, one record per affected account, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Delta reasoning — what changed since the last delivered record, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Provenance class — filing · disclosure · reported · rumour · model output, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }

  - area: Implication reasoning
    stage: Reason it
    customization_scope_area: >-
      Reasoning prompts per domain · Ripple rules per domain · Client catalog and mapping
      logic · Scoring rubric and thresholds per client
    categories:
      - name: Evidence
        features:
          - { name: Evidence assembly and ranking across first-party and public sources, status: available, oracle_pack: available, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Evidence set shown for review before the reasoning, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Contradiction between reliable sources surfaced as a finding, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
      - name: The implication
        features:
          - { name: Opportunity and risk reasoning — the "so what" per account, status: partial, oracle_pack: partial, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Dual implication — one signal yields an opportunity and a risk, routed separately, status: roadmap, oracle_pack: none, tier_first_available: integration, source: research-brief-2026-09-22 }
          - { name: Inference validity — does the conclusion follow from the cited evidence, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
      - name: Catalog mapping
        note: "The pack's primary differentiator. No strong implementation exists in the market."
        features:
          - { name: Opportunity mapped to a named service line the client actually sells, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10, reviewer-ui-2026-09-11 }
          - { name: Catalog target configurable — offering · lever · mitigation · none, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Demand-gap stream — implications that mapped to nothing, emitted as a product-gap feed, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
      - name: Ripple
        note: "Zero implementation anywhere in the market, including Oracle and NVIDIA. The relationship edges are licensable today."
        features:
          - { name: Cross-account ripple, descriptive, up to two levels, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Graph-backed ripple over a licensed relationship graph, status: roadmap, oracle_pack: none, tier_first_available: scaling, source: research-brief-2026-09-22 }
          - { name: Portfolio aggregation — correlated groups evaluated as the unit, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
      - name: Scoring
        features:
          - { name: Magnitude and confidence scored 0-10 per item, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10, reviewer-ui-2026-09-11 }
          - { name: Calibrated confidence tested against realized outcomes, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Cost-aware ranking under a capacity constraint, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }

  - area: Review & evidence
    stage: Review it
    customization_scope_area: >-
      Reviewer layout and workflow configuration · Evaluation set and rubric per client ·
      Feedback fields per workflow
    categories:
      - name: The reviewer
        note: "Oracle contractually assigns human oversight to the customer, which makes this blessed white space rather than merely unoccupied."
        features:
          - { name: Reviewer UI — opportunities, sources, confidence, approve / reject with comment, status: available, oracle_pack: partial, tier_first_available: pov, source: reviewer-ui-2026-09-11 }
          - { name: Citations and evidence traceability with visible chain of thought, status: available, oracle_pack: available, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Human triage of raw inbound before anything is written, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Reviewer disagreement analysed as a signal against the rule, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
      - name: Evaluation
        features:
          - { name: Evaluation harness — correctness and confidence calibration, status: partial, oracle_pack: partial, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Human-feedback capture as an input, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Feedback-driven tuning — a persisted learning loop, status: roadmap, oracle_pack: none, tier_first_available: scaling, source: one-pager-2026-09-10 }
          - { name: Negative assertion — "screened, nothing found, on date X, against sources Y", status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Point-in-time replay of a past record on the evidence that existed then, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }
          - { name: Retraction re-checking against source publication status, status: roadmap, oracle_pack: none, source: research-brief-2026-09-22 }

  - area: Output & delivery
    stage: Deliver it
    customization_scope_area: >-
      Output schema per client · Integration configuration per target system ·
      Routing and ownership rules
    categories:
      - name: The record
        features:
          - { name: Structured per-account record — account, trigger, summary, reasoning, scored opportunities, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
          - { name: Narrative briefing and discussion guide as an alternative output contract, status: partial, oracle_pack: available, tier_first_available: pov, source: sow-uc6 }
          - { name: Confidence threshold filtering low-confidence items, status: partial, oracle_pack: none, tier_first_available: pov, source: one-pager-2026-09-10 }
      - name: Delivery
        features:
          - { name: Export to the client's sales system, status: partial, oracle_pack: partial, tier_first_available: integration, source: one-pager-2026-09-10 }
          - { name: Routing to the named owner of that account, status: roadmap, oracle_pack: none, tier_first_available: integration, source: research-brief-2026-09-22 }
          - { name: Live write-back with idempotency and dedupe-on-write, status: roadmap, oracle_pack: none, tier_first_available: integration, source: research-brief-2026-09-22 }
          - { name: Outcome capture — pursued · won · lost · false positive — fed back to scoring, status: roadmap, oracle_pack: none, tier_first_available: scaling, source: research-brief-2026-09-22 }
          - { name: Acting on opportunities — auto-outreach, task creation, workflow automation, status: roadmap, oracle_pack: none, source: one-pager-2026-09-10 }
