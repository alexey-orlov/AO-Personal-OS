<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Abstract app window with a magnifier over linked nodes">
  <!-- SS26 placeholder · ground -->
  <rect x="0" y="0" width="960" height="600" fill="#edf0f2"/>

  <!-- window, octagonal 4px cuts -->
  <polygon points="76,56 884,56 888,60 888,540 884,544 76,544 72,540 72,60" fill="#ffffff" stroke="#bdcbd7" stroke-width="1.5"/>

  <!-- title bar -->
  <polygon points="76,56 884,56 888,60 888,112 72,112 72,60" fill="#e1e7eb"/>
  <path d="M72 112 H888" stroke="#bdcbd7" stroke-width="1.5" fill="none"/>
  <rect x="100" y="78" width="12" height="12" fill="#bdcbd7"/>
  <rect x="122" y="78" width="12" height="12" fill="#bdcbd7"/>
  <rect x="144" y="78" width="12" height="12" fill="#bdcbd7"/>

  <!-- left rail -->
  <polygon points="72,112 208,112 208,544 76,544 72,540" fill="#e1e7eb"/>
  <path d="M208 112 V544" stroke="#bdcbd7" stroke-width="1.5" fill="none"/>
  <rect x="88" y="148" width="104" height="14" fill="#c1dff4"/>
  <rect x="88" y="184" width="104" height="14" fill="#d1dae2"/>
  <rect x="88" y="220" width="104" height="14" fill="#d1dae2"/>
  <rect x="88" y="256" width="104" height="14" fill="#d1dae2"/>
  <rect x="88" y="292" width="104" height="14" fill="#d1dae2"/>

  <!-- content: a query field over three result rows -->
  <rect x="240" y="136" width="400" height="28" fill="#e1e7eb"/>
  <rect x="254" y="145" width="150" height="10" fill="#d1dae2"/>
  <rect x="824" y="134" width="32" height="22" fill="#d1dae2"/>
  <rect x="240" y="188" width="616" height="96" fill="#e1e7eb"/>
  <rect x="264" y="212" width="220" height="12" fill="#d1dae2"/>
  <rect x="264" y="244" width="380" height="10" fill="#d1dae2"/>
  <rect x="240" y="300" width="616" height="96" fill="#e1e7eb"/>
  <rect x="264" y="324" width="260" height="12" fill="#d1dae2"/>
  <rect x="264" y="356" width="330" height="10" fill="#d1dae2"/>
  <rect x="240" y="412" width="616" height="96" fill="#e1e7eb"/>
  <rect x="264" y="436" width="190" height="12" fill="#d1dae2"/>
  <rect x="264" y="468" width="400" height="10" fill="#d1dae2"/>

  <!-- group icon: a magnifier over three linked nodes, 24-grid at 1.5px, scaled 10x -->
  <g opacity="0.25" transform="translate(540,210) scale(10)" fill="none" stroke="#4c5156" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 17.5 L12 5.5 L19 16 Z"/>
    <circle cx="5" cy="17.5" r="1.9"/>
    <circle cx="12" cy="5.5" r="1.9"/>
    <circle cx="19" cy="16" r="1.9"/>
    <circle cx="12.6" cy="11.4" r="6.4"/>
    <path d="M17.1 15.9 L21.2 20"/>
  </g>
</svg>
